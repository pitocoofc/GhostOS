<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GhostOS - BIOS CRITICAL ERROR</title>
    <style>
        :root { 
            --error-red: #ff3b30; 
            --neon-blue: #00f2ff; 
            --bg: #050505;
        }
        
        body, html {
            margin: 0; padding: 0; height: 100vh;
            background: var(--bg); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Courier New', monospace;
            overflow: hidden; user-select: none;
        }

        /* Efeito de linhas CRT clássico do GhostOS */
        body::before {
            content: " ";
            position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 3px;
            z-index: 1000; pointer-events: none;
        }

        .error-container {
            width: 90%;
            max-width: 650px;
            border: 2px solid var(--error-red);
            background: rgba(15, 5, 5, 0.85);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.2);
            position: relative;
        }

        h1 {
            color: var(--error-red);
            font-size: 20px;
            margin-top: 0;
            border-bottom: 1px solid var(--error-red);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-code {
            background: #110505;
            padding: 12px;
            border-left: 4px solid var(--error-red);
            margin: 20px 0;
            color: #ffb3b3;
            font-size: 13px;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker { 50% { opacity: 0; } }

        p {
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
        }

        /* Console Log de Flashing */
        #flash-log {
            font-size: 11px;
            color: #888;
            max-height: 100px;
            overflow-y: hidden;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .success-text {
            color: var(--neon-blue) !important;
            font-weight: bold;
        }

        /* Botões Estilizados */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            background: none;
            border: 1px solid #555;
            color: #aaa;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        button.action-btn {
            border-color: var(--error-red);
            color: var(--error-red);
        }

        button.action-btn:hover {
            background: var(--error-red);
            color: #000;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>[ Hardware Abstraction Layer Error ]</h1>
        
        <p>The system had problems with the BIOS image. <span class="blink">SYSTEM HALTED.</span></p>
        
        <div class="error-code">
            STATUS_CODE: GHOST_CRASH_0x00000044<br>
            REASON: ROM_SIGNATURE_MISSING_OR_INVALID<br>
            OFFSET: 0x0000F4A2
        </div>

        <div id="flash-log">Awaiting operator action...</div>

        <div class="btn-group">
            <button class="action-btn" id="btn-generate" onclick="generateNewBios()">Gerar Nova BIOS</button>
            <button onclick="tryAgain()">Tentar Novamente</button>
        </div>
    </div>

    <script>
    function speakWelcome() {
        if ('speechSynthesis' in window) {
            const msg = new SpeechSynthesisUtterance('Verificando compatibilidade do sistema...');
            msg.lang = 'pt-BR';
            msg.rate = 1.0; 
            msg.pitch = 0.9; 
            window.speechSynthesis.speak(msg);
        }
    }

    function tryAgain() {
        window.location.href = "index.html";
    }

    function appendLog(element, text, isHTML = false) {
        if (isHTML) {
            element.innerHTML += text;
        } else {
            element.innerText += text;
        }
        element.scrollTop = element.scrollHeight;
    }

    async function generateNewBios() {
        let parentDirHandle = null;

        // 1. SOLICITA PERMISSÃO DE PASTA IMEDIATAMENTE (No topo do evento de clique)
        if ('showDirectoryPicker' in window && (!window.Capacitor || !window.Capacitor.Plugins.Filesystem)) {
            try {
                // Abre a janela para o usuário selecionar onde quer salvar no dispositivo
                parentDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            } catch (err) {
                if (err.name === 'AbortError') {
                    alert("Ação cancelada pelo usuário.");
                    return;
                }
                console.warn("Seletor de diretório não autorizado:", err);
            }
        }

        // 2. Efeitos Sonoros e Interface
        const bootAudio = new Audio('assets/audios/bios.wav'); 
        bootAudio.volume = 0.5; 
        bootAudio.play().catch(err => console.log("Erro de áudio:", err));
        speakWelcome();
        
        const log = document.getElementById('flash-log');
        const btnGen = document.getElementById('btn-generate');
        
        btnGen.disabled = true;
        btnGen.innerText = "Injetando...";
        log.innerText = "Connecting to Motherboard EEPROM...\n";

        setTimeout(() => {
            appendLog(log, "Erasing corrupted sectors (0x000000 - 0xFFFFFF)...\n");
            
            setTimeout(async () => {
                appendLog(log, "Generating raw matrix binary from A to Z...\n");
                
                // 3. GERAÇÃO DO BINÁRIO DA BIOS
                let binaryMatrix = "";
                const totalRows = 30;
                const targetRow = Math.floor(Math.random() * (25 - 5 + 1)) + 5;

                for (let i = 0; i < totalRows; i++) {
                    if (i === targetRow) {
                        binaryMatrix += "01101011 01110011  0110111 Err BOS  010101001010001001 : 01101111 01110011\n";
                    } else {
                        let row = "";
                        for(let b = 0; b < 4; b++) {
                            let byte = "";
                            for(let bit = 0; bit < 8; bit++) {
                                byte += Math.round(Math.random());
                            }
                            row += byte + " ";
                        }
                        binaryMatrix += row.trim() + "\n";
                    }
                }

                // 4. PERSISTÊNCIA DOS DADOS

                // A. Grava no LocalStorage do navegador
                localStorage.setItem('ghost_bios_image', binaryMatrix);

                // B. Grava via Capacitor Filesystem (Se rodando em app nativo Android/iOS)
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
                    try {
                        const { Filesystem } = window.Capacitor.Plugins;
                        const { Directory, Encoding } = window.Capacitor;
                        
                        await Filesystem.writeFile({
                            path: 'GhostOS/ghost_bios.rom',
                            data: binaryMatrix,
                            directory: Directory.Documents,
                            encoding: Encoding.UTF8,
                            recursive: true
                        });
                        appendLog(log, "Writing to Capacitor Filesystem (Documents/GhostOS)...\n");
                    } catch (capErr) {
                        console.error("Erro no Capacitor Filesystem:", capErr);
                        appendLog(log, "Filesystem write deferred to Web Storage.\n");
                    }
                } 
                // C. Grava via File System Access API (Navegador/Chromium)
                else if (parentDirHandle) {
                    try {
                        // Cria a subpasta "GhostOS" dentro da pasta que o usuário escolheu
                        const subDirHandle = await parentDirHandle.getDirectoryHandle("GhostOS", { create: true });
                        
                        // Cria/Abre o arquivo ghost_bios.rom dentro da subpasta GhostOS
                        const fileHandle = await subDirHandle.getFileHandle("ghost_bios.rom", { create: true });
                        const writable = await fileHandle.createWritable();
                        
                        await writable.write(binaryMatrix);
                        await writable.close();
                        
                        appendLog(log, `Writing to: /${parentDirHandle.name}/GhostOS/ghost_bios.rom...\n`);
                    } catch (dirErr) {
                        console.error("Erro ao gravar na pasta:", dirErr);
                        appendLog(log, "<span class='error-code'>[ AVISO ] Erro de gravação na pasta. Armazenado no WebStorage.</span>\n", true);
                    }
                } else {
                    appendLog(log, "Saved to Local Storage (GhostOS Memory).\n");
                }

                appendLog(log, "Writing signature payload to block offset...\n");
                
                setTimeout(() => {
                    appendLog(log, "<span class='success-text'>[ SUCCESS ] ROM successfully flashed! Re-booting...</span>", true);
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500); 
                }, 800);
            }, 800);
        }, 600);
    }
    </script>
    
</body>
</html>
