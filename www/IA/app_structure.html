<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndj-Neo v2 | Image Studio</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --accent-color: #00ff88; /* Verde Neo */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --text-main: #e0e0e0;
            --border-color: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body, html { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg-primary); font-family: 'Inter', -apple-system, sans-serif; color: var(--text-main); }

        /* HEADER MODULAR */
        #neo-header {
            padding: 20px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, #111 0%, #0a0a0a 100%);
        }
        #app-name-v2 { font-weight: 600; font-size: 1.1rem; letter-spacing: 1px; color: #fff; }
        .voltar-btn { background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: 0.3s; }
        .voltar-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }

        /* ÁREA DE EXIBIÇÃO DA IMAGEM */
        #studio-container {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
            height: calc(100% - 170px);
        }

        #image-viewer {
            width: 100%; max-width: 550px; height: 380px;
            background: #050505; border: 2px solid var(--border-color); border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        #image-viewer.generating {
            border-color: var(--accent-color);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
            100% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.5); }
        }

        #generated-image {
            width: 100%; height: 100%; object-fit: contain;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        #generated-image.visible { opacity: 1; }

        /* LOADER */
        #loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: absolute;
            z-index: 10;
        }

        #loader {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.05);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #loader-text {
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* FOOTER COM OPÇÕES E PROMPT */
        #neo-footer {
            position: fixed; bottom: 0; width: 100%; padding: 15px 20px;
            background: linear-gradient(180deg, transparent 0%, #0a0a0a 100%);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .controls-wrapper {
            display: flex; gap: 10px; width: 100%; max-width: 600px; justify-content: flex-end;
        }

        .model-select {
            background: #121212; color: #aaa; border: 1px solid #222;
            padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; cursor: pointer;
        }

        .input-prompt-wrapper {
            display: flex; align-items: center; background: #121212;
            border-radius: 18px; padding: 6px 12px 6px 18px; border: 1px solid #222;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.5);
            width: 100%; max-width: 600px;
            transition: border-color 0.3s;
        }
        
        .input-prompt-wrapper:focus-within {
            border-color: rgba(0, 255, 136, 0.4);
        }

        #promptInput { 
            flex: 1; border: none; background: transparent; color: #fff; 
            padding: 10px 10px 10px 0; font-size: 0.95rem; 
        }
        
        #generateBtn {
            background: var(--accent-color); color: #000; border: none;
            padding: 12px 24px; border-radius: 12px; font-weight: bold; font-size: 0.9rem;
            cursor: pointer; transition: 0.3s; white-space: nowrap;
        }
        #generateBtn:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(0,255,136,0.4); }
        #generateBtn:disabled { background: #222; color: #555; cursor: not-allowed; transform: scale(1); box-shadow: none; }

    </style>
</head>
<body>

    <div id="neo-header">
        <div id="app-name-v2">Ndj-Neo Image Studio</div>
        <button class="voltar-btn" onclick="window.location.href = 'ia.html'">Acessar Ndj-Core v1</button>
    </div>

    <div id="studio-container">
        <div id="image-viewer">
            <div id="loader-container">
                <div id="loader"></div>
                <div id="loader-text">Sintetizando Imagem...</div>
            </div>
            <img id="generated-image" src="" alt="Sua imagem aparecerá aqui">
        </div>
    </div>

    <div id="neo-footer">
        <div class="controls-wrapper">
            <!-- Seletor de Modelo -->
            <select id="modelSelect" class="model-select">
                <option value="flux">Modelo: Flux (Realista/Ultra)</option>
                <option value="turbo">Modelo: Turbo (Rápido)</option>
                <option value="anime">Modelo: Anime</option>
            </select>
        </div>

        <div class="input-prompt-wrapper">
            <input type="text" id="promptInput" placeholder="Descreva a imagem que deseja criar..." onkeydown="handleKeyPress(event)">
            <button id="generateBtn" onclick="gerarImagemPollinations()">Gerar Imagem</button>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                gerarImagemPollinations();
            }
        }

        function gerarImagemPollinations() {
            const input = document.getElementById('promptInput');
            const btn = document.getElementById('generateBtn');
            const loaderContainer = document.getElementById('loader-container');
            const img = document.getElementById('generated-image');
            const viewer = document.getElementById('image-viewer');
            const selectedModel = document.getElementById('modelSelect').value;

            let prompt = input.value.trim();

            if (!prompt) {
                alert("Por favor, digite uma descrição para a imagem!");
                return;
            }

            // A "Régua" de Qualidade: adiciona sufixos de renderização de alta definição
            const qualityBoost = ", highly detailed, cinematic lighting, 8k resolution, masterpiece";
            const finalPrompt = prompt + qualityBoost;

            // 1. Atualiza interface
            btn.disabled = true;
            btn.textContent = "Gerando...";
            input.disabled = true;
            
            img.classList.remove('visible'); 
            viewer.classList.add('generating'); 
            loaderContainer.style.display = "flex"; 

            // 2. Monta a URL com o modelo escolhido
            const seed = Math.floor(Math.random() * 999999);
            const encodedPrompt = encodeURIComponent(finalPrompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?model=${selectedModel}&seed=${seed}&width=1024&height=768&nologo=true`;

            // 3. Quando a imagem carregar
            img.onload = function() {
                loaderContainer.style.display = "none";
                viewer.classList.remove('generating');
                img.classList.add('visible');

                btn.disabled = false;
                btn.textContent = "Gerar Novamente";
                input.disabled = false;
            };

            // 4. Se der erro
            img.onerror = function() {
                loaderContainer.style.display = "none";
                viewer.classList.remove('generating');
                alert("Erro ao conectar à API do Pollinations. Tente outro modelo.");

                btn.disabled = false;
                btn.textContent = "Tentar Novamente";
                input.disabled = false;
            };

            img.src = imageUrl;
        }
    </script>
</body>
</html>
