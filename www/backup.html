<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostOS - Backup System</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 20% 20%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 80%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 460px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h2 { 
            margin: 0 0 8px 0; 
            color: var(--accent-cyan);
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .section {
            margin: 16px 0;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.3s;
        }

        .section:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 10px;
            margin: 8px 0 12px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #38bdf8;
            box-sizing: border-box;
            outline: none;
            font-family: monospace;
            font-size: 11px;
            resize: none;
            word-break: break-all;
        }

        textarea:focus {
            border-color: var(--accent-cyan);
        }

        button {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        button:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }

        button.decompress { 
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        button.decompress:hover { 
            box-shadow: 0 6px 16px rgba(5, 150, 105, 0.4);
        }

        #status {
            margin-top: 16px;
            font-size: 13px;
            font-weight: 500;
            min-height: 20px;
            transition: color 0.3s ease;
        }

        .pulse {
            animation: pulseAnim 1.5s infinite;
        }

        @keyframes pulseAnim {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>GhostOS Vault</h2>
        <p class="subtitle">Backup 1.0</p>
        
        
        <div class="section">
            <button id="exportBtn">Gerar Código de Backup</button>
            <textarea id="outputArea" readonly placeholder="Clique no botão acima para gerar o código..."></textarea>
            <button id="copyBtn" style="display:none; background: #334155;">Copiar Código</button>
        </div>

        
        <div class="section">
            <textarea id="inputArea" placeholder="Cole o código de backup aqui..."></textarea>
            <button class="decompress" id="importBtn">Restaurar LocalStorage</button>
        </div>

        <div id="status">Aguardando ação...</div>
    </div>

    <script>
         
        class BitWriter {
            constructor() {
                this.bytes = [];
                this.currentByte = 0;
                this.bitCount = 0;
            }
            writeBit(bit) {
                if (bit) this.currentByte |= (1 << (7 - this.bitCount));
                this.bitCount++;
                if (this.bitCount === 8) {
                    this.bytes.push(this.currentByte);
                    this.currentByte = 0;
                    this.bitCount = 0;
                }
            }
            writeBits(strBits) {
                for (let i = 0; i < strBits.length; i++) this.writeBit(strBits[i] === '1');
            }
            flush() {
                if (this.bitCount > 0) this.bytes.push(this.currentByte);
                return new Uint8Array(this.bytes);
            }
        }

        class BitReader {
            constructor(uint8Array) {
                this.data = uint8Array;
                this.byteIndex = 0;
                this.bitCount = 0;
            }
            readBit() {
                if (this.byteIndex >= this.data.length) return 0;
                const bit = (this.data[this.byteIndex] >> (7 - this.bitCount)) & 1;
                this.bitCount++;
                if (this.bitCount === 8) {
                    this.bitCount = 0;
                    this.byteIndex++;
                }
                return bit;
            }
        }

        
        function buildHuffmanTree(frequencies) {
            const pq = [];
            for (let symbol in frequencies) {
                pq.push({ symbol: parseInt(symbol), freq: frequencies[symbol], left: null, right: null });
            }
            if (pq.length === 0) return null;
            if (pq.length === 1) return { symbol: null, freq: pq[0].freq, left: pq[0], right: null };

            while (pq.length > 1) {
                pq.sort((a, b) => a.freq - b.freq);
                const left = pq.shift();
                const right = pq.shift();
                pq.push({ symbol: null, freq: left.freq + right.freq, left, right });
            }
            return pq[0];
        }

        function generateCodes(node, currentCode = '', codes = {}) {
            if (!node) return;
            if (node.symbol !== null) {
                codes[node.symbol] = currentCode || '0';
                return;
            }
            generateCodes(node.left, currentCode + '0', codes);
            generateCodes(node.right, currentCode + '1', codes);
            return codes;
        }

        
        function compressLZ77(uint8Array) {
            const out = [];
            let i = 0;
            const len = uint8Array.length;
            const windowSize = 8192; 
            const maxMatchLength = 255;

            while (i < len) {
                let bestMatchDistance = 0;
                let bestMatchLength = 0;
                const searchStart = Math.max(0, i - windowSize);
                
                for (let j = searchStart; j < i; j++) {
                    let matchLen = 0;
                    while (i + matchLen < len && matchLen < maxMatchLength && uint8Array[j + matchLen] === uint8Array[i + matchLen]) {
                        matchLen++;
                    }
                    if (matchLen > bestMatchLength) {
                        bestMatchLength = matchLen;
                        bestMatchDistance = i - j;
                    }
                }

                if (bestMatchLength >= 3) { // Reduzido threshold para 3 bytes
                    out.push(0xAF, (bestMatchDistance >> 8) & 0xFF, bestMatchDistance & 0xFF, bestMatchLength);
                    i += bestMatchLength;
                } else {
                    let literalBytes = [];
                    let j = i;
                    while (j < len && literalBytes.length < 255) {
                        let lookAheadMatch = false;
                        if (j + 3 < len) {
                            const subStart = Math.max(0, j - windowSize);
                            for (let sj = subStart; sj < j; sj++) {
                                if (uint8Array[sj] === uint8Array[j] && uint8Array[sj+1] === uint8Array[j+1] && 
                                    uint8Array[sj+2] === uint8Array[j+2]) {
                                    lookAheadMatch = true;
                                    break;
                                }
                            }
                        }
                        if (lookAheadMatch) break;
                        literalBytes.push(uint8Array[j]);
                        j++;
                    }
                    if (literalBytes.length === 0) {
                        literalBytes.push(uint8Array[i]);
                        j = i + 1;
                    }
                    out.push(0xAE, literalBytes.length, ...literalBytes);
                    i = j;
                }
            }
            return new Uint8Array(out);
        }

        function decompressLZ77(uint8Array) {
            const out = [];
            let i = 0;
            const len = uint8Array.length;

            while (i < len) {
                const marker = uint8Array[i++];
                if (i >= len) break;

                if (marker === 0xAE) {
                    const literalLen = uint8Array[i++];
                    for (let c = 0; c < literalLen; c++) out.push(uint8Array[i++]);
                } else if (marker === 0xAF) {
                    const distance = (uint8Array[i++] << 8) | uint8Array[i++];
                    const matchLength = uint8Array[i++];
                    const startPos = out.length - distance;
                    for (let c = 0; c < matchLength; c++) out.push(out[startPos + c]);
                }
            }
            return new Uint8Array(out);
        }

        
        function compressFull(uint8Array) {
            const lz77Data = compressLZ77(uint8Array);
            const freq = {};
            for (let i = 0; i < lz77Data.length; i++) freq[lz77Data[i]] = (freq[lz77Data[i]] || 0) + 1;

            const tree = buildHuffmanTree(freq);
            const codes = generateCodes(tree);
            const keys = Object.keys(freq);
            const writer = new BitWriter();

            const headerBytes = [(keys.length >> 8) & 0xFF, keys.length & 0xFF];
            for (let sym of keys) {
                const f = freq[sym];
                headerBytes.push(parseInt(sym), (f >> 24) & 0xFF, (f >> 16) & 0xFF, (f >> 8) & 0xFF, f & 0xFF);
            }

            for (let i = 0; i < lz77Data.length; i++) writer.writeBits(codes[lz77Data[i]]);
            const huffmanBytes = writer.flush();

            const finalBuffer = new Uint8Array(headerBytes.length + huffmanBytes.length);
            finalBuffer.set(headerBytes, 0);
            finalBuffer.set(huffmanBytes, headerBytes.length);
            return finalBuffer;
        }

        function decompressFull(uint8Array) {
            let offset = 0;
            const numSymbols = (uint8Array[offset] << 8) | uint8Array[offset+1];
            offset += 2;

            const freq = {};
            for (let i = 0; i < numSymbols; i++) {
                const sym = uint8Array[offset++];
                const f = (uint8Array[offset] << 24) | (uint8Array[offset+1] << 16) | (uint8Array[offset+2] << 8) | uint8Array[offset+3];
                offset += 4;
                freq[sym] = f;
            }

            const tree = buildHuffmanTree(freq);
            const reader = new BitReader(uint8Array.slice(offset));
            const lz77Data = [];
            let totalSymbols = 0;
            for (let sym in freq) totalSymbols += freq[sym];

            let currentNode = tree;
            while (lz77Data.length < totalSymbols) {
                const bit = reader.readBit();
                currentNode = (bit === 0) ? currentNode.left : currentNode.right;
                if (currentNode && currentNode.symbol !== null) {
                    lz77Data.push(currentNode.symbol);
                    currentNode = tree;
                }
            }
            return decompressLZ77(new Uint8Array(lz77Data));
        }

        
        async function tryNativeCompress(uint8) {
            if ('CompressionStream' in window) {
                try {
                    const cs = new CompressionStream('deflate-raw');
                    const writer = cs.writable.getWriter();
                    writer.write(uint8);
                    writer.close();
                    const buf = await new Response(cs.readable).arrayBuffer();
                    return { data: new Uint8Array(buf), isNative: true };
                } catch (e) {}
            }
            return { data: compressFull(uint8), isNative: false };
        }

        async function tryNativeDecompress(uint8, isNative) {
            if (isNative && 'DecompressionStream' in window) {
                const ds = new DecompressionStream('deflate-raw');
                const writer = ds.writable.getWriter();
                writer.write(uint8);
                writer.close();
                const buf = await new Response(ds.readable).arrayBuffer();
                return new Uint8Array(buf);
            }
            return decompressFull(uint8);
        }

        
        function updateStatus(text, color = '#f8fafc', isPulse = false) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.style.color = color;
            status.className = isPulse ? 'pulse' : '';
        }

        function uint8ToBase64(bytes) {
            let binary = '';
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function base64ToUint8(base64) {
            const binary = window.atob(base64.trim());
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        document.getElementById('exportBtn').addEventListener('click', async () => {
            try {
                updateStatus('Lendo LocalStorage...', '#38bdf8', true);
                const rawJSON = JSON.stringify(localStorage);
                const rawBytes = new TextEncoder().encode(rawJSON);

                updateStatus('Aplicando taxa máxima de compressão...', '#38bdf8', true);
                
                const { data: compressed, isNative } = await tryNativeCompress(rawBytes);

                
                const base64 = (isNative ? 'N:' : 'H:') + uint8ToBase64(compressed);

                const outputArea = document.getElementById('outputArea');
                const copyBtn = document.getElementById('copyBtn');
                outputArea.value = base64;
                copyBtn.style.display = 'block';

                const taxa = ((1 - (base64.length / rawJSON.length)) * 100).toFixed(1);
                updateStatus(`Backup gerado! Reduzido em ${taxa}%. Copie o código abaixo.`, '#10b981');
            } catch (err) {
                console.error(err);
                updateStatus('Erro ao compactar dados.', '#ef4444');
            }
        });

        document.getElementById('copyBtn').addEventListener('click', async () => {
            const outputArea = document.getElementById('outputArea');
            if (!outputArea.value) return;

            try {
                await navigator.clipboard.writeText(outputArea.value);
                updateStatus('Código copiado para a área de transferência!', '#10b981');
            } catch (err) {
                outputArea.select();
                document.execCommand('copy');
                updateStatus('Código selecionado/copiado!', '#10b981');
            }
        });

        document.getElementById('importBtn').addEventListener('click', async () => {
            const inputArea = document.getElementById('inputArea');
            const code = inputArea.value.trim();

            if (!code) {
                updateStatus('Cole o código de backup antes de restaurar!', '#ef4444');
                return;
            }

            try {
                updateStatus('Descompactando dados...', '#38bdf8', true);
                
                let isNative = false;
                let cleanCode = code;

                if (code.startsWith('N:')) {
                    isNative = true;
                    cleanCode = code.substring(2);
                } else if (code.startsWith('H:')) {
                    isNative = false;
                    cleanCode = code.substring(2);
                }

                const compressedBytes = base64ToUint8(cleanCode);
                const decompressedBytes = await tryNativeDecompress(compressedBytes, isNative);

                const jsonString = new TextDecoder().decode(decompressedBytes);
                const data = JSON.parse(jsonString);

                localStorage.clear();
                Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));

                updateStatus('GhostOS restaurado com sucesso!', '#10b981');
            } catch (err) {
                console.error(err);
                updateStatus('Código inválido ou corrompido.', '#ef4444');
            }
        });
    </script>
</body>
</html>
