<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GhostOS - BIOS CRITICAL ERROR</title>
    <style>
        :root { 
            --error-red: #ff3b30; 
            --neon-blue: #00f2ff; 
            --bg: #050505;
        }
        
        body, html {
            margin: 0; padding: 0; height: 100vh;
            background: var(--bg); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Courier New', monospace;
            overflow: hidden; user-select: none;
        }

        body::before {
            content: " ";
            position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 3px;
            z-index: 1000; pointer-events: none;
        }

        .error-container {
            width: 90%;
            max-width: 650px;
            border: 2px solid var(--error-red);
            background: rgba(15, 5, 5, 0.85);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.2);
            position: relative;
        }

        h1 {
            color: var(--error-red);
            font-size: 20px;
            margin-top: 0;
            border-bottom: 1px solid var(--error-red);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-code {
            background: #110505;
            padding: 12px;
            border-left: 4px solid var(--error-red);
            margin: 20px 0;
            color: #ffb3b3;
            font-size: 13px;
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        p { font-size: 14px; line-height: 1.6; color: #ddd; }

        #flash-log {
            font-size: 11px;
            color: #888;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .success-text { color: var(--neon-blue) !important; font-weight: bold; }

        .btn-group { display: flex; gap: 15px; margin-top: 25px; }

        button, label.action-btn {
            flex: 1;
            background: none;
            border: 1px solid #555;
            color: #aaa;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            text-align: center;
            display: inline-block;
        }

        button:hover, label.action-btn:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        button.action-btn, label.action-btn {
            border-color: var(--error-red);
            color: var(--error-red);
        }

        button.action-btn:hover, label.action-btn:hover {
            background: var(--error-red);
            color: #000;
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>[ Hardware Abstraction Layer Error ]</h1>
        
        <p>The system had problems with the BIOS image. <span class="blink">SYSTEM HALTED.</span></p>
        
        <div class="error-code">
            STATUS_CODE: GHOST_CRASH_0x00000044<br>
            REASON: ROM_SIGNATURE_MISSING_OR_INVALID<br>
            OFFSET: 0x0000F4A2
        </div>

        <div id="flash-log">Awaiting operator action...</div>

        <div class="btn-group">
            <!-- Botão para disparar gravação com seletor no Android/Web -->
            <button class="action-btn" id="btn-generate" onclick="startBiosGeneration()">Gerar Nova BIOS</button>
            <button onclick="tryAgain()">Tentar Novamente</button>
        </div>

        <!-- Input invisível para forçar a abertura do gerenciador de pastas nativo no Android/Browser -->
        <input type="file" id="folder-picker" webkitdirectory directory hidden onchange="handleFolderSelected(this)">
    </div>

    <script>
    let selectedDirectoryName = "";

    function tryAgain() {
        window.location.href = "index.html";
    }

    function appendLog(element, text, isHTML = false) {
        if (isHTML) {
            element.innerHTML += text;
        } else {
            element.innerText += text;
        }
        element.scrollTop = element.scrollHeight;
    }

    async function startBiosGeneration() {
        const log = document.getElementById('flash-log');
        
        // 1. TENTA ABRIR O SELETOR DE DIRETORES NATIVO
        if ('showDirectoryPicker' in window) {
            try {
                window.parentDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                selectedDirectoryName = window.parentDirHandle.name;
            } catch (err) {
                console.warn("Seleção de pasta ignorada/cancelada.");
            }
            executeFlashingProcess();
        } else {
            // No Android WebView onde showDirectoryPicker NÃO existe, dispara o input nativo
            document.getElementById('folder-picker').click();
        }
    }

    function handleFolderSelected(input) {
        if (input.files && input.files.length > 0) {
            // Pega o nome da pasta selecionada via input nativo
            const pathParts = input.files[0].webkitRelativePath.split('/');
            selectedDirectoryName = pathParts[0] || "CustomFolder";
        }
        executeFlashingProcess();
    }

    async function executeFlashingProcess() {
        const log = document.getElementById('flash-log');
        const btnGen = document.getElementById('btn-generate');
        
        btnGen.disabled = true;
        btnGen.innerText = "Injetando...";
        log.innerText = "Connecting to Motherboard EEPROM...\n";

        // Geração do Payload da ROM
        let binaryMatrix = "";
        const totalRows = 30;
        const targetRow = 12;

        for (let i = 0; i < totalRows; i++) {
            if (i === targetRow) {
                binaryMatrix += "01101011 01110011 Err BOS 010101001010001001 01101111 01110011\n";
            } else {
                let row = "";
                for(let b = 0; b < 4; b++) {
                    let byte = "";
                    for(let bit = 0; bit < 8; bit++) byte += Math.round(Math.random());
                    row += byte + " ";
                }
                binaryMatrix += row.trim() + "\n";
            }
        }

        // 1. GRAVA NO CACHE LOCAL (localStorage)
        localStorage.setItem('ghost_bios_image', binaryMatrix);
        appendLog(log, "[ OK ] ROM Cache updated in localStorage.\n");

        // 2. GRAVA VIA CAPACITOR FILESYSTEM (Se estiver rodando como APP Android Nativo)
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
            try {
                const { Filesystem } = window.Capacitor.Plugins;
                const { Directory, Encoding } = window.Capacitor;
                
                // Criar diretório GhostOS e gravar o arquivo .rom
                await Filesystem.writeFile({
                    path: 'GhostOS/ghost_bios.rom',
                    data: binaryMatrix,
                    directory: Directory.ExternalStorage || Directory.Documents,
                    encoding: Encoding.UTF8,
                    recursive: true
                });
                appendLog(log, "[ OK ] Saved to Device Storage: /GhostOS/ghost_bios.rom\n");
            } catch (capErr) {
                appendLog(log, "[ WARN ] Capacitor Storage access error. Using local cache.\n");
            }
        } 
        // 3. GRAVA SE USOU A FILE SYSTEM ACCESS API (Desktop/Chromium)
        else if (window.parentDirHandle) {
            try {
                const subDirHandle = await window.parentDirHandle.getDirectoryHandle("GhostOS", { create: true });
                const fileHandle = await subDirHandle.getFileHandle("ghost_bios.rom", { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(binaryMatrix);
                await writable.close();
                appendLog(log, `[ OK ] Directory created: /${selectedDirectoryName}/GhostOS/ghost_bios.rom\n`);
            } catch (err) {
                appendLog(log, "[ WARN ] Failed writing folder physically.\n");
            }
        } else {
            appendLog(log, `[ OK ] Target Directory set: /${selectedDirectoryName || 'Default'}/GhostOS/\n`);
        }

        setTimeout(() => {
            appendLog(log, "<span class='success-text'>[ SUCCESS ] ROM successfully flashed! Re-booting...</span>", true);
            setTimeout(() => { window.location.href = "index.html"; }, 1500);
        }, 1000);
    }
    </script>
</body>
</html>
