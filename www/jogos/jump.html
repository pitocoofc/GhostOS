<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pulo Duplo</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a0b2e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }

  #game {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(26, 11, 46, 0.9);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 10;
    padding: 24px;
    text-align: center;
    transition: opacity 0.35s ease;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .title {
    font-size: 44px;
    font-weight: 900;
    background: linear-gradient(135deg, #ffd166, #ff8a3d, #ff4d6d);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
    letter-spacing: 1px;
    line-height: 1.05;
  }

  .subtitle {
    font-size: 15px;
    color: #b39ddb;
    margin-bottom: 34px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .instructions {
    font-size: 15px;
    color: #e0d0ff;
    line-height: 1.8;
    margin-bottom: 38px;
    max-width: 320px;
  }

  .instructions strong {
    color: #ffd166;
  }

  .badge {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(255, 209, 102, 0.15);
    border: 1px solid rgba(255, 209, 102, 0.4);
    border-radius: 100px;
    font-size: 12px;
    color: #ffd166;
    margin-top: 8px;
    letter-spacing: 1px;
  }

  .btn {
    padding: 18px 54px;
    font-size: 17px;
    font-weight: 800;
    color: #1a0b2e;
    background: linear-gradient(135deg, #ffd166, #ff8a3d);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1.5px;
    box-shadow: 0 8px 32px rgba(255, 138, 61, 0.45);
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
    text-transform: uppercase;
  }

  .btn:active {
    transform: scale(0.94);
    box-shadow: 0 4px 16px rgba(255, 138, 61, 0.6);
  }

  .gameover-title {
    font-size: 38px;
    font-weight: 900;
    color: #ff4d6d;
    text-shadow: 0 0 24px rgba(255, 77, 109, 0.6);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .score-final {
    font-size: 16px;
    color: #b39ddb;
    margin-bottom: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .score-number {
    font-size: 64px;
    font-weight: 900;
    color: #ffd166;
    text-shadow: 0 0 30px rgba(255, 209, 102, 0.5);
    line-height: 1;
    margin-bottom: 20px;
  }

  .best {
    font-size: 13px;
    color: #8a7aa8;
    margin-bottom: 34px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .best span {
    color: #ffd166;
    font-weight: 800;
  }

  .new-record {
    font-size: 13px;
    color: #4df0ff;
    font-weight: 800;
    margin-bottom: 24px;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: pulse 1s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.05); }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="overlay" id="menu">
  <div class="title">PULO<br>DUPLO</div>
  <div class="subtitle">endless runner</div>
  <div class="instructions">
    <strong>Toque</strong> para pular.<br>
    <strong>Toque de novo</strong> no ar para pulo duplo.<br>
    Desvie dos obstáculos e voe alto!
  </div>
  <button class="btn" id="btnStart">JOGAR</button>
</div>

<div class="overlay hidden" id="gameover">
  <div class="gameover-title">BATEU!</div>
  <div class="score-final">Pontuação</div>
  <div class="score-number" id="finalScore">0</div>
  <div class="new-record" id="newRecord" style="display:none;">★ NOVO RECORDE ★</div>
  <div class="best">Melhor: <span id="bestScore">0</span></div>
  <button class="btn" id="btnRestart">TENTAR DE NOVO</button>
</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  // ===== Estados =====
  const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
  let state = STATE.MENU;

  // ===== Mundo =====
  const GROUND_H = 90; // altura do chão
  let groundY;

  // ===== Player =====
  const player = {
    x: 0,
    y: 0,
    vy: 0,
    w: 36,
    h: 46,
    onGround: true,
    jumpsLeft: 2,
    rotation: 0,
    squash: 1
  };

  const GRAVITY = 2100;
  const JUMP_V = -820;
  const JUMP_V2 = -700;

  // ===== Obstáculos =====
  let obstacles = [];
  let coins = [];
  let particles = [];
  let bgElements = []; // estrelas / nuvens
  let score = 0;
  let coinCount = 0;
  let best = parseInt(localStorage.getItem('puloduplo_best') || '0', 10);
  let speed = 340;
  let spawnTimer = 0;
  let spawnInterval = 1200;
  let coinTimer = 0;
  let elapsed = 0;
  let lastTime = 0;
  let shakeTime = 0;
  let groundOffset = 0;
  let bgOffset = 0;
  let flashTime = 0;

  // ===== Inicialização =====
  function resetGame() {
    groundY = H - GROUND_H;
    player.x = W * 0.25;
    player.y = groundY - player.h;
    player.vy = 0;
    player.onGround = true;
    player.jumpsLeft = 2;
    player.rotation = 0;
    player.squash = 1;

    obstacles = [];
    coins = [];
    particles = [];
    score = 0;
    coinCount = 0;
    speed = 340;
    spawnTimer = 0;
    spawnInterval = 1200;
    coinTimer = 400;
    elapsed = 0;
    shakeTime = 0;
    groundOffset = 0;
    bgOffset = 0;
    flashTime = 0;

    // Estrelas
    bgElements = [];
    for (let i = 0; i < 60; i++) {
      bgElements.push({
        x: Math.random() * W,
        y: Math.random() * groundY,
        r: Math.random() * 1.8 + 0.4,
        speed: 10 + Math.random() * 30,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }

  function startGame() {
    resetGame();
    state = STATE.PLAYING;
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('gameover').classList.add('hidden');
    document.getElementById('newRecord').style.display = 'none';
  }

  function gameOver() {
    state = STATE.GAMEOVER;
    shakeTime = 0.5;
    flashTime = 0.3;

    // Explosão de partículas
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 80 + Math.random() * 320;
      particles.push({
        x: player.x + player.w / 2,
        y: player.y + player.h / 2,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 100,
        life: 1,
        decay: 0.9 + Math.random(),
        size: 2 + Math.random() * 5,
        color: Math.random() < 0.5 ? '#ff4d6d' : '#ffd166'
      });
    }

    let isRecord = false;
    if (score > best) {
      best = score;
      localStorage.setItem('puloduplo_best', best);
      isRecord = true;
    }

    document.getElementById('finalScore').textContent = score;
    document.getElementById('bestScore').textContent = best;
    if (isRecord) document.getElementById('newRecord').style.display = 'block';
    document.getElementById('gameover').classList.remove('hidden');
  }

  // ===== Input =====
  function jump() {
    if (state !== STATE.PLAYING) return;
    if (player.jumpsLeft > 0) {
      const isFirst = player.jumpsLeft === 2;
      player.vy = isFirst ? JUMP_V : JUMP_V2;
      player.jumpsLeft -= 1;
      player.onGround = false;
      player.squash = isFirst ? 0.75 : 0.85; // estica no pulo

      // Partículas no pulo
      const color = isFirst ? '#ffd166' : '#ff8a3d';
      for (let i = 0; i < (isFirst ? 8 : 12); i++) {
        const a = Math.PI * (0.2 + Math.random() * 0.6); // meio círculo pra baixo
        const s = 60 + Math.random() * 180;
        particles.push({
          x: player.x + player.w / 2,
          y: player.y + player.h,
          vx: Math.cos(a) * s * (Math.random() < 0.5 ? -1 : 1),
          vy: Math.sin(a) * s,
          life: 0.6,
          decay: 2.2,
          size: 2 + Math.random() * 3,
          color
        });
      }
    }
  }

  function onPointerDown(e) {
    e.preventDefault();
    if (state === STATE.PLAYING) {
      jump();
    }
  }

  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('mousedown', onPointerDown);

  // Também permite usar espaço no desktop pra testar
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (state === STATE.PLAYING) jump();
    }
  });

  // ===== Spawn =====
  function spawnObstacle() {
    // Tipos: 0 = baixo (pular), 1 = alto (agachar ou pulo duplo), 2 = triplo
    const r = Math.random();
    let type, w, h, y;

    if (r < 0.6) {
      // Obstáculo baixo (só pular)
      w = 26 + Math.random() * 20;
      h = 30 + Math.random() * 40;
      y = groundY - h;
      type = 0;
    } else if (r < 0.9) {
      // Obstáculo alto (pulo duplo ou pulo bem cronometrado)
      w = 28 + Math.random() * 18;
      h = 80 + Math.random() * 40;
      y = groundY - h;
      type = 1;
    } else {
      // Grupo de 2 obstáculos
      w = 22 + Math.random() * 14;
      h = 35 + Math.random() * 30;
      y = groundY - h;
      type = 2;
    }

    const obs = {
      x: W + 20,
      y, w, h,
      type,
      // Animação
      hue: type === 1 ? 280 : 340 + Math.random() * 20,
      wobble: Math.random() * Math.PI * 2
    };
    obstacles.push(obs);

    if (type === 2) {
      // Segundo obstáculo com espaçamento
      obstacles.push({
        x: W + 20 + w + 90 + Math.random() * 60,
        y: groundY - (h * 0.9),
        w: w * 0.9,
        h: h * 0.9,
        type: 0,
        hue: 280,
        wobble: Math.random() * Math.PI * 2
      });
    }
  }

  function spawnCoin() {
    // Moeda em arco (3 moedas em sequência)
    const baseX = W + 40;
    const baseY = groundY - 120 - Math.random() * 120;
    const count = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      coins.push({
        x: baseX + i * 42,
        y: baseY - Math.sin(i / (count - 1 || 1) * Math.PI) * 40,
        r: 12,
        collected: false,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  // ===== Update =====
  function update(dt) {
    // Partículas sempre
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 900 * dt;
      p.vx *= 0.98;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shakeTime > 0) shakeTime -= dt;
    if (flashTime > 0) flashTime -= dt;

    // Estrelas sempre animam (mesmo no menu/gameover, sutil)
    for (const s of bgElements) {
      s.x -= s.speed * dt * (state === STATE.PLAYING ? 1 : 0.3);
      s.twinkle += dt * 3;
      if (s.x < -5) {
        s.x = W + 5;
        s.y = Math.random() * groundY;
      }
    }

    if (state !== STATE.PLAYING) return;

    elapsed += dt;
    groundOffset = (groundOffset + speed * dt) % 60;
    bgOffset = (bgOffset + speed * 0.15 * dt) % 200;

    // Dificuldade
    speed = 340 + elapsed * 14;
    spawnInterval = Math.max(500, 1200 - elapsed * 22);
    if (speed > 800) speed = 800;

    // Física do player
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;

    const floorY = groundY - player.h;
    if (player.y >= floorY) {
      player.y = floorY;
      player.vy = 0;
      if (!player.onGround) {
        // Aterrissou
        player.squash = 1.35; // achata no impacto
        // Poeirinha
        for (let i = 0; i < 6; i++) {
          particles.push({
            x: player.x + player.w / 2 + (Math.random() - 0.5) * player.w,
            y: groundY,
            vx: (Math.random() - 0.5) * 140,
            vy: -Math.random() * 120,
            life: 0.5,
            decay: 2.5,
            size: 2 + Math.random() * 3,
            color: '#b39ddb'
          });
        }
      }
      player.onGround = true;
      player.jumpsLeft = 2;
    } else {
      player.onGround = false;
    }

    // Rotação no ar (para dar sensação de movimento)
    if (!player.onGround) {
      player.rotation += dt * 6 * Math.sign(player.vy || 1) * -1;
    } else {
      // Volta ao normal suave
      player.rotation += (0 - player.rotation) * Math.min(1, dt * 12);
    }

    // Squash & stretch volta ao normal
    player.squash += (1 - player.squash) * Math.min(1, dt * 10);

    // Spawn de obstáculos
    spawnTimer += dt * 1000;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnObstacle();
    }

    // Spawn de moedas
    coinTimer -= dt * 1000;
    if (coinTimer <= 0) {
      coinTimer = 1600 + Math.random() * 1800;
      spawnCoin();
    }

    // Atualiza obstáculos
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed * dt;
      o.wobble += dt * 4;

      if (o.x + o.w < -20) {
        obstacles.splice(i, 1);
        score += 1;
        continue;
      }

      // Colisão AABB com margem generosa (mais justo pro jogador)
      const mx = 4, my = 3;
      if (player.x + mx < o.x + o.w - mx &&
          player.x + player.w - mx > o.x + mx &&
          player.y + my < o.y + o.h - my &&
          player.y + player.h - my > o.y + my) {
        gameOver();
        return;
      }
    }

    // Atualiza moedas
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.x -= speed * dt;
      c.phase += dt * 6;

      if (c.x + c.r < -20) {
        coins.splice(i, 1);
        continue;
      }

      // Coleta (círculo x AABB)
      const cx = Math.max(player.x, Math.min(c.x, player.x + player.w));
      const cy = Math.max(player.y, Math.min(c.y, player.y + player.h));
      const dx = c.x - cx;
      const dy = c.y - cy;
      if (dx * dx + dy * dy < c.r * c.r) {
        coins.splice(i, 1);
        coinCount += 1;
        score += 5;
        // Explosão dourada
        for (let k = 0; k < 14; k++) {
          const a = Math.random() * Math.PI * 2;
          const s = 80 + Math.random() * 240;
          particles.push({
            x: c.x,
            y: c.y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 0.7,
            decay: 1.8,
            size: 2 + Math.random() * 3,
            color: '#ffd166'
          });
        }
      }
    }
  }

  // ===== Render =====
  function drawBackground() {
    // Gradiente céu noturno
    const g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, '#1a0b2e');
    g.addColorStop(0.5, '#2d1550');
    g.addColorStop(1, '#4a2060');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, groundY);

    // Estrelas
    for (const s of bgElements) {
      const tw = 0.5 + 0.5 * Math.sin(s.twinkle);
      ctx.globalAlpha = 0.3 + tw * 0.7;
      ctx.fillStyle = s.r > 1.4 ? '#ffd166' : '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Lua
    const moonX = W * 0.78;
    const moonY = groundY * 0.22;
    const moonGrad = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, 80);
    moonGrad.addColorStop(0, 'rgba(255, 240, 200, 0.5)');
    moonGrad.addColorStop(1, 'rgba(255, 240, 200, 0)');
    ctx.fillStyle = moonGrad;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 80, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff4d6';
    ctx.beginPath();
    ctx.arc(moonX, moonY, 26, 0, Math.PI * 2);
    ctx.fill();

    // Cratera
    ctx.fillStyle = 'rgba(200, 180, 140, 0.4)';
    ctx.beginPath();
    ctx.arc(moonX - 8, moonY - 4, 5, 0, Math.PI * 2);
    ctx.arc(moonX + 6, moonY + 8, 3, 0, Math.PI * 2);
    ctx.arc(moonX + 10, moonY - 10, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGround() {
    // Chão principal
    const g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, '#3d1f5c');
    g.addColorStop(0.3, '#2a1240');
    g.addColorStop(1, '#1a0b2e');
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY, W, H - groundY);

    // Linha brilhante no topo do chão
    ctx.fillStyle = '#ff8a3d';
    ctx.fillRect(0, groundY, W, 3);

    ctx.fillStyle = 'rgba(255, 209, 102, 0.4)';
    ctx.fillRect(0, groundY - 1, W, 1);

    // Padrão de listras no chão
    ctx.strokeStyle = 'rgba(255, 138, 61, 0.15)';
    ctx.lineWidth = 2;
    const stripes = Math.ceil(W / 60) + 2;
    for (let i = -1; i < stripes; i++) {
      const x = i * 60 - groundOffset;
      ctx.beginPath();
      ctx.moveTo(x, groundY + 8);
      ctx.lineTo(x - 30, H);
      ctx.stroke();
    }
  }

  function drawPlayer() {
    const cx = player.x + player.w / 2;
    const cy = player.y + player.h / 2;

    // Glow
    const glowR = 45;
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    glow.addColorStop(0, 'rgba(255, 209, 102, 0.35)');
    glow.addColorStop(1, 'rgba(255, 209, 102, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);

    // Rotação leve no ar
    ctx.rotate(player.rotation * 0.35);

    // Squash & stretch
    const sy = player.squash;
    const sx = 1 / sy;

    // Corpo (arredondado)
    const bodyGrad = ctx.createLinearGradient(0, -player.h / 2, 0, player.h / 2);
    bodyGrad.addColorStop(0, '#ffe08a');
    bodyGrad.addColorStop(0.5, '#ffd166');
    bodyGrad.addColorStop(1, '#ff8a3d');
    ctx.fillStyle = bodyGrad;

    const w = player.w * sx;
    const h = player.h * sy;
    const r = 10;
    roundRect(-w / 2, -h / 2, w, h, r);
    ctx.fill();

    // Brilho topo
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    roundRect(-w / 2 + 4, -h / 2 + 4, w - 8, h * 0.28, 6);
    ctx.fill();

    // Olhos
    const eyeY = -h / 2 + h * 0.35;
    const eyeOffset = w * 0.18;
    ctx.fillStyle = '#1a0b2e';
    ctx.beginPath();
    ctx.arc(-eyeOffset, eyeY, 3.2, 0, Math.PI * 2);
    ctx.arc(eyeOffset, eyeY, 3.2, 0, Math.PI * 2);
    ctx.fill();

    // Brilho nos olhos
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-eyeOffset + 1, eyeY - 1, 1, 0, Math.PI * 2);
    ctx.arc(eyeOffset + 1, eyeY - 1, 1, 0, Math.PI * 2);
    ctx.fill();

    // Boquinha
    ctx.strokeStyle = '#1a0b2e';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (player.onGround) {
      // Sorriso
      ctx.arc(0, eyeY + 8, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    } else if (player.vy < 0) {
      // Boca "O" de surpresa ao subir
      ctx.arc(0, eyeY + 10, 3.5, 0, Math.PI * 2);
    } else {
      // Determinado ao cair
      ctx.moveTo(-5, eyeY + 12);
      ctx.lineTo(5, eyeY + 12);
    }
    ctx.stroke();

    ctx.restore();
  }

  function drawObstacles() {
    for (const o of obstacles) {
      const cx = o.x + o.w / 2;
      const cy = o.y + o.h / 2;

      // Glow
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(o.w, o.h) * 1.2);
      glow.addColorStop(0, `hsla(${o.hue}, 80%, 60%, 0.4)`);
      glow.addColorStop(1, `hsla(${o.hue}, 80%, 60%, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(o.w, o.h) * 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Corpo com gradiente
      const grad = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
      grad.addColorStop(0, `hsl(${o.hue}, 85%, 65%)`);
      grad.addColorStop(1, `hsl(${o.hue}, 75%, 35%)`);
      ctx.fillStyle = grad;

      roundRect(o.x, o.y, o.w, o.h, 6);
      ctx.fill();

      // Espinhos no topo (para obstáculos)
      ctx.fillStyle = `hsl(${o.hue}, 85%, 70%)`;
      const spikeCount = Math.max(2, Math.floor(o.w / 12));
      const spikeW = o.w / spikeCount;
      ctx.beginPath();
      for (let i = 0; i < spikeCount; i++) {
        const sx = o.x + i * spikeW + spikeW / 2;
        ctx.moveTo(sx - spikeW * 0.35, o.y + 1);
        ctx.lineTo(sx, o.y - 6);
        ctx.lineTo(sx + spikeW * 0.35, o.y + 1);
      }
      ctx.fill();

      // Reflexo lateral
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      roundRect(o.x + 3, o.y + 3, 4, o.h - 6, 2);
      ctx.fill();
    }
  }

  function drawCoins() {
    for (const c of coins) {
      const pulse = 1 + Math.sin(c.phase) * 0.08;
      const r = c.r * pulse;

      // Glow
      const glow = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r * 2.5);
      glow.addColorStop(0, 'rgba(255, 209, 102, 0.6)');
      glow.addColorStop(1, 'rgba(255, 209, 102, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(c.x, c.y, r * 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Moeda
      const coinGrad = ctx.createRadialGradient(c.x - r * 0.3, c.y - r * 0.3, 0, c.x, c.y, r);
      coinGrad.addColorStop(0, '#fff4b0');
      coinGrad.addColorStop(0.5, '#ffd166');
      coinGrad.addColorStop(1, '#d99b1a');
      ctx.fillStyle = coinGrad;
      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
      ctx.fill();

      // Borda
      ctx.strokeStyle = '#8a5a00';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Brilho
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(c.x - r * 0.35, c.y - r * 0.35, r * 0.25, 0, Math.PI * 2);
      ctx.fill();

      // Símbolo interno
      ctx.strokeStyle = 'rgba(138, 90, 0, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(c.x, c.y, r * 0.5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    if (state === STATE.MENU) return;

    ctx.save();

    // Pontuação
    ctx.font = '900 34px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.shadowColor = 'rgba(255, 209, 102, 0.8)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffd166';
    ctx.fillText(score, W / 2, 28);

    ctx.shadowBlur = 0;
    ctx.font = '600 11px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(179, 157, 219, 0.85)';
    ctx.fillText('PONTOS', W / 2, 68);

    // Recorde
    ctx.textAlign = 'right';
    ctx.font = '700 12px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255, 209, 102, 0.7)';
    ctx.fillText('MELHOR ' + best, W - 16, 20);

    // Contador de moedas
    if (coinCount > 0) {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(22, 26, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8a5a00';
      ctx.beginPath();
      ctx.arc(22, 26, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.font = '800 15px -apple-system, sans-serif';
      ctx.fillText(coinCount, 36, 19);
    }

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function render() {
    ctx.save();

    if (shakeTime > 0) {
      const s = 16 * (shakeTime / 0.5);
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    drawBackground();
    drawGround();
    drawCoins();
    drawObstacles();

    if (state !== STATE.GAMEOVER) {
      drawPlayer();
    }

    drawParticles();
    drawHUD();

    // Flash
    if (flashTime > 0) {
      ctx.fillStyle = 'rgba(255, 77, 109, ' + (flashTime / 0.3 * 0.55) + ')';
      ctx.fillRect(-50, -50, W + 100, H + 100);
    }

    ctx.restore();
  }

  // ===== Loop =====
  function loop(now) {
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ===== Eventos UI =====
  document.getElementById('btnStart').addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
  });
  document.getElementById('btnRestart').addEventListener('click', (e) => {
    e.stopPropagation();
    startGame();
  });

  document.addEventListener('touchmove', (e) => {
    if (e.target === canvas) e.preventDefault();
  }, { passive: false });

  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // ===== Init =====
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
