<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GhostClock OS</title>
    <style>
        :root { --green: #00ff9d; --red: #ff3b30; --bg: #000; --ios-orange: #ff9f0a; --ios-green: #34c759; --ios-sep: #38383a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER / TABS */
        .tabs { display: flex; justify-content: center; gap: 4px; padding: 14px 8px; background: #111; border-bottom: 1px solid #222; }
        .tab-btn { background: none; border: none; color: #555; font-weight: bold; font-size: 13px; padding: 10px 12px; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { color: var(--green); background: #222; }

        /* CONTAINER DE CONTEÚDO */
        .content-area { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
        .screen { position: absolute; width: 100%; text-align: center; transition: opacity 0.5s ease, transform 0.5s ease; visibility: hidden; opacity: 0; }
        .screen.active { visibility: visible; opacity: 1; transform: scale(1); }

        /* RELÓGIO */
        .time-text { font-size: 80px; font-weight: 200; display: block; height: 100px; transition: opacity 0.5s; }
        .date-text { font-size: 14px; color: var(--green); letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; }
        
        /* CRONÔMETRO */
        .sw-display { font-size: 65px; font-family: monospace; margin-bottom: 30px; }
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 15px 30px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; min-width: 120px; }
        #sw-toggle { background: var(--green); color: #000; }
        .btn-reset { background: #333; color: #fff; }

        /* SELETOR */
        .footer { padding: 30px; text-align: center; }
        #region-select { background: #111; color: white; border: 1px solid #333; padding: 12px; border-radius: 10px; width: 80%; max-width: 300px; outline: none; }
        .fade-out { opacity: 0; }

        /* ===== ALARME (estilo iOS) ===== */
        #screen-alarm { top: 0; bottom: 0; display: flex; flex-direction: column; text-align: left; overflow-y: auto; padding-bottom: 30px; }
        #screen-alarm::-webkit-scrollbar { display: none; }

        .al-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 0; }
        .al-link { background: none; border: none; color: var(--ios-orange); font-size: 17px; cursor: pointer; }
        .al-plus { font-size: 32px; line-height: 1; padding: 0 4px; }
        .al-title { font-size: 34px; font-weight: 700; padding: 6px 20px 10px; }
        .al-sec { font-size: 13px; color: #8e8e93; padding: 10px 20px 6px; }

        .al-row { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--ios-sep); cursor: pointer; }
        .al-row:active { background: #1c1c1e; }
        .al-main { flex: 1; min-width: 0; }
        .al-time { font-size: 52px; font-weight: 300; line-height: 1.05; letter-spacing: -1px; }
        .al-sub { font-size: 14px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .al-row.off .al-time, .al-row.off .al-sub { color: #8e8e93; }
        .al-minus { display: none; width: 24px; height: 24px; border-radius: 50%; border: none; background: #ff3b30; color: #fff; font-size: 18px; line-height: 1; flex-shrink: 0; cursor: pointer; }
        .editing .al-minus { display: block; }
        .editing .al-row .ios-sw { display: none; }
        .al-empty { color: #8e8e93; text-align: center; padding: 60px 20px; font-size: 15px; line-height: 1.6; }

        .ios-sw { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
        .ios-sw input { opacity: 0; width: 0; height: 0; }
        .ios-sw span { position: absolute; inset: 0; background: #39393d; border-radius: 16px; transition: .25s; cursor: pointer; }
        .ios-sw span:before { content: ""; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px; background: #fff; border-radius: 50%; box-shadow: 0 2px 4px #0004; transition: .25s; }
        .ios-sw input:checked + span { background: var(--ios-green); }
        .ios-sw input:checked + span:before { transform: translateX(20px); }

        /* Folha de edição */
        #al-sheet { position: fixed; inset: 0; background: #000000a0; z-index: 50; display: none; align-items: flex-end; }
        #al-sheet.open { display: flex; }
        .sheet { width: 100%; max-height: 94%; overflow-y: auto; background: #1c1c1e; border-radius: 14px 14px 0 0; animation: sheetUp .3s cubic-bezier(.2,.8,.2,1); }
        @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
        .sh-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; font-size: 17px; }
        .sh-bar b { font-weight: 600; }

        .wheels { position: relative; display: flex; justify-content: center; height: 180px; margin: 6px 16px 16px; background: #2c2c2e; border-radius: 14px; overflow: hidden; }
        .wheels:before { content: ""; position: absolute; left: 8px; right: 8px; top: 72px; height: 36px; background: #ffffff1a; border-radius: 8px; pointer-events: none; }
        .wheels:after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(#2c2c2e, #2c2c2e00 35%, #2c2c2e00 65%, #2c2c2e); }
        .wheel { width: 80px; height: 180px; overflow-y: auto; scroll-snap-type: y mandatory; padding: 72px 0; text-align: center; }
        .wheel::-webkit-scrollbar { display: none; }
        .wheel div { height: 36px; line-height: 36px; font-size: 24px; scroll-snap-align: center; }
        .colon { align-self: center; font-size: 24px; }

        .grp { background: #2c2c2e; border-radius: 12px; margin: 0 16px 16px; overflow: hidden; }
        .grp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--ios-sep); font-size: 16px; }
        .grp-row input[type=text] { flex: 1; min-width: 0; background: none; border: none; color: #fff; text-align: right; font-size: 16px; outline: none; }
        .days { display: flex; justify-content: space-between; padding: 12px 16px; }
        .day { width: 36px; height: 36px; border-radius: 50%; border: none; background: #3a3a3c; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
        .day.on { background: var(--ios-orange); color: #000; }
        .del { display: block; width: calc(100% - 32px); margin: 0 16px 24px; padding: 14px; border: none; border-radius: 12px; background: #2c2c2e; color: #ff453a; font-size: 17px; cursor: pointer; }
    </style>
</head>

    <div class="tabs">
        <button id="tab-clock" class="tab-btn active" onclick="showScreen('clock')">RELÓGIO</button>
        <button id="tab-alarm" class="tab-btn" onclick="showScreen('alarm')">ALARME</button>
        <button id="tab-sw" class="tab-btn" onclick="showScreen('sw')">CRONÔMETRO</button>
    </div>

    <div class="content-area">

        <div id="screen-alarm" class="screen">

            </div>
            <div class="al-title">Alarme</div>
            <div class="al-sec">Alarmes</div>
            <div id="al-list"></div>
        </div>

        <div id="screen-sw" class="screen">
            <div id="sw-val" class="sw-display">00:00.00</div>
            <div class="controls">
                <button id="sw-toggle" class="btn" onclick="toggleSW()">INICIAR</button>
                <button class="btn btn-reset" onclick="resetSW()">ZERAR</button>
            </div>
        </div>
    </div>

    <div id="al-sheet" onclick="if(event.target === this) closeSheet()">
        <div class="sheet">
            <div class="sh-bar">
                <button class="al-link" onclick="closeSheet()">Cancelar</button>
                <b id="sh-title">Adicionar Alarme</b>
                <button class="al-link" style="font-weight:600" onclick="saveAlarm()">Salvar</button>
            </div>
            <div class="wheels">
                <div class="wheel" id="w-h"></div>
                <span class="colon">:</span>
                <div class="wheel" id="w-m"></div>
            </div>
            <div class="grp">
                <div class="days" id="days"></div>
                <div class="grp-row"><span>Etiqueta</span><input type="text" id="al-label" placeholder="Alarme" maxlength="24"></div>
                <div class="grp-row"><span>Soneca</span><label class="ios-sw"><input type="checkbox" id="al-snooze" checked><span></span></label></div>
            </div>
            <button class="del" id="al-del" onclick="deleteFromSheet()">Excluir Alarme</button>
        </div>
    </div>

    <script>
        // --- ALARME (estilo iOS) ---
        // Aqui fica só a interface. Quem toca o alarme é o agendador do index.
        const DAYS = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
        const DAYN = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        let alarms = [], editingId = null, editMode = false;

        const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function loadAlarms() {
            try { alarms = JSON.parse(localStorage.getItem('ghost_alarms')) || []; } catch (e) { alarms = []; }
        }
        function persist() {
            try { localStorage.setItem('ghost_alarms', JSON.stringify(alarms)); } catch (e) {}
            parent.postMessage({ type: 'alarms_changed' }, '*');   // o index atualiza o ⏰ da barra
        }

        function repeatText(a) {
            const r = a.repeat || [];
            if (!r.length) return '';
            if (r.length === 7) return 'Todos os dias';
            if (r.length === 5 && [1, 2, 3, 4, 5].every(d => r.includes(d))) return 'Dias úteis';
            if (r.length === 2 && r.includes(0) && r.includes(6)) return 'Fins de semana';
            return r.slice().sort((x, y) => x - y).map(d => DAYN[d]).join(', ');
        }

        function renderAlarms() {
            document.getElementById('screen-alarm').classList.toggle('editing', editMode);
            document.getElementById('al-edit').textContent = editMode ? 'OK' : 'Editar';
            const box = document.getElementById('al-list');
            if (!alarms.length) {
                box.innerHTML = '<div class="al-empty">Nenhum alarme.<br>Toque em + para criar um.</div>';
                return;
            }
            const sorted = [...alarms].sort((a, b) => a.h * 60 + a.m - (b.h * 60 + b.m));
            box.innerHTML = sorted.map(a => {
                const sub = [a.label || 'Alarme', repeatText(a)].filter(Boolean).join(', ');
                const t = String(a.h).padStart(2, '0') + ':' + String(a.m).padStart(2, '0');
                return `<div class="al-row ${a.on ? '' : 'off'}" onclick="openSheet('${a.id}')">
                    <button class="al-minus" onclick="event.stopPropagation();removeAlarm('${a.id}')">−</button>
                    <div class="al-main"><div class="al-time">${t}</div><div class="al-sub">${esc(sub)}</div></div>
                    <label class="ios-sw" onclick="event.stopPropagation()">
                        <input type="checkbox" ${a.on ? 'checked' : ''} onchange="toggleAlarm('${a.id}', this.checked)"><span></span>
                    </label>
                </div>`;
            }).join('');
        }

        function toggleEdit() { editMode = !editMode; renderAlarms(); }

        function toggleAlarm(id, on) {
            const a = alarms.find(x => x.id === id);
            if (!a) return;
            a.on = on; persist(); renderAlarms();
            if (on) toastNext(a);
        }

        function removeAlarm(id) {
            alarms = alarms.filter(x => x.id !== id);
            persist(); renderAlarms();
        }

        // "Toca em 7 h 20 min", como o iOS mostra ao salvar
        function nextIn(a) {
            const now = new Date();
            for (let i = 0; i < 8; i++) {
                const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, a.h, a.m, 0);
                if (d <= now) continue;
                if (a.repeat && a.repeat.length && !a.repeat.includes(d.getDay())) continue;
                return d - now;
            }
            return null;
        }
        function toastNext(a) {
            const ms = nextIn(a);
            if (ms === null) return;
            const mins = Math.ceil(ms / 60000);
            const d = Math.floor(mins / 1440), h = Math.floor(mins % 1440 / 60), m = mins % 60;
            const txt = [d && d + ' d', h && h + ' h', m && m + ' min'].filter(Boolean).join(' ') || 'menos de 1 min';
            parent.postMessage({ type: 'SHOW_TOAST', title: 'Alarme', message: 'Toca em ' + txt, icon: '⏰' }, '*');
        }

        // --- Folha de edição ---
        function buildWheels() {
            const mk = (id, n) => document.getElementById(id).innerHTML =
                Array.from({ length: n }, (_, i) => `<div>${String(i).padStart(2, '0')}</div>`).join('');
            mk('w-h', 24); mk('w-m', 60);
            document.getElementById('days').innerHTML = DAYS.map((d, i) =>
                `<button class="day" data-d="${i}" onclick="this.classList.toggle('on')">${d}</button>`).join('');
        }

        function openSheet(id) {
            editingId = id || null;
            const a = id ? alarms.find(x => x.id === id) : null;
            const now = new Date();
            document.getElementById('sh-title').textContent = a ? 'Editar Alarme' : 'Adicionar Alarme';
            document.getElementById('al-label').value = a ? a.label : '';
            document.getElementById('al-snooze').checked = a ? a.snooze !== false : true;
            document.getElementById('al-del').style.display = a ? 'block' : 'none';
            document.querySelectorAll('.day').forEach(b =>
                b.classList.toggle('on', !!a && (a.repeat || []).includes(+b.dataset.d)));
            document.getElementById('al-sheet').classList.add('open');
            const h = a ? a.h : now.getHours(), m = a ? a.m : now.getMinutes();
            requestAnimationFrame(() => {   // só dá pra posicionar a roda depois que a folha aparece
                document.getElementById('w-h').scrollTop = h * 36;
                document.getElementById('w-m').scrollTop = m * 36;
            });
        }
        function closeSheet() { document.getElementById('al-sheet').classList.remove('open'); }

        function saveAlarm() {
            const h = Math.min(23, Math.round(document.getElementById('w-h').scrollTop / 36));
            const m = Math.min(59, Math.round(document.getElementById('w-m').scrollTop / 36));
            const data = {
                h, m, on: true,
                repeat: [...document.querySelectorAll('.day.on')].map(b => +b.dataset.d),
                label: document.getElementById('al-label').value.trim(),
                snooze: document.getElementById('al-snooze').checked
            };
            let a = editingId ? alarms.find(x => x.id === editingId) : null;
            if (a) Object.assign(a, data);
            else { a = { id: 'a' + Date.now(), ...data }; alarms.push(a); }
            persist(); renderAlarms(); closeSheet(); toastNext(a);
        }
        function deleteFromSheet() { removeAlarm(editingId); closeSheet(); }

        // Se o index desligar um alarme único depois que ele tocar, a lista acompanha
        window.addEventListener('storage', e => {
            if (e.key === 'ghost_alarms') { loadAlarms(); renderAlarms(); }
        });

            sel.value = saved;
            if (sel.value !== saved) sel.value = 'pt-BR';
        }

            const selected = document.getElementById('region-select').value;
            localStorage.setItem('ghost_clock_region', selected); // Salva apenas a escolha da região

        // --- RELÓGIO ---
        function updateClock() {
            if (currentMode !== 'clock') return;

            const region = document.getElementById('region-select').value;
            const now = new Date();
            const tz = timeZones[region] || "America/Sao_Paulo";   // nunca cai no fuso do aparelho sem avisar

            const timeStr = now.toLocaleTimeString('pt-BR', {
                timeZone: tz, hour: '2-digit', minute: '2-digit'
            });

            if (timeStr !== lastMinute) {
                const el = document.getElementById('txt-time');
                el.classList.add('fade-out');

                setTimeout(() => {
                    el.innerText = timeStr;
                    // 'pt-BR' fixo: o código do país não é um idioma (ml-ML = malaiala, ne-NE = nepalês...)
                    document.getElementById('txt-date').innerText = now.toLocaleDateString('pt-BR', {
                        weekday: 'long', day: 'numeric', month: 'short', timeZone: tz
                    }).toUpperCase();
                    el.classList.remove('fade-out');
                    lastMinute = timeStr;
                }, 500);
            }
        }

        // --- NAVEGAÇÃO ---
        function showScreen(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('region-container').style.display = (mode === 'clock') ? 'block' : 'none';

            document.getElementById({ clock: 'tab-clock', alarm: 'tab-alarm', sw: 'tab-sw' }[mode]).classList.add('active');
            document.getElementById('screen-' + mode).classList.add('active');

            if (mode === 'clock') updateClock();
            if (mode === 'alarm') renderAlarms();
        }

        // --- CRONÔMETRO (baseado no relógio real, não em contagem de ticks) ---
        let swInterval, swStart = 0, swElapsed = 0, isRunning = false;
        const pad = n => String(n).padStart(2, '0');

        function swFormat(ms) {
            const t = Math.floor(ms / 10);
            return `${pad(Math.floor(t / 6000))}:${pad(Math.floor((t % 6000) / 100))}.${pad(t % 100)}`;
        }

        function toggleSW() {
            const btn = document.getElementById('sw-toggle');
            if (!isRunning) {
                isRunning = true;
                swStart = performance.now() - swElapsed;   // continua de onde parou
                btn.innerText = "PARAR"; btn.style.background = "#ff3b30";
                swInterval = setInterval(() => {
                    swElapsed = performance.now() - swStart;
                    document.getElementById('sw-val').innerText = swFormat(swElapsed);
                }, 30);
            } else {
                isRunning = false;
                clearInterval(swInterval);
                swElapsed = performance.now() - swStart;
                document.getElementById('sw-val').innerText = swFormat(swElapsed);
                btn.innerText = "CONTINUAR"; btn.style.background = "#00ff9d";
            }
        }

        function resetSW() {
            clearInterval(swInterval); isRunning = false; swElapsed = 0;
            document.getElementById('sw-val').innerText = "00:00.00";
            document.getElementById('sw-toggle').innerText = "INICIAR";
            document.getElementById('sw-toggle').style.background = "#00ff9d";
        }

        // INICIALIZAÇÃO
        window.onload = () => {
            loadSavedRegion();
            loadAlarms();
            buildWheels();
            updateClock();
            setInterval(updateClock, 1000);
        };
    </script>
</body>
</html>
