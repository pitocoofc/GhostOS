<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Snake Offline</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0f0f0f;
    color: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 16px;
    gap: 10px;
  }
  .game-header {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .game-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #fff;
  }
  .game-badge {
    font-size: 11px;
    color: #2ecc71;
    background: rgba(46,204,113,0.12);
    padding: 3px 10px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .game-badge svg { width: 12px; height: 12px; }
  .score-row {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    color: #aaa;
  }
  .score-row strong { color: #fff; font-weight: 500; }
  .mode-tag {
    font-size: 11px;
    color: #f39c12;
    background: rgba(243,156,18,0.12);
    padding: 2px 8px;
    border-radius: 20px;
  }
  .canvas-wrap {
    position: relative;
    border: 2px solid #333;
    border-radius: 12px;
    overflow: hidden;
    background: #1a1a1a;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  canvas { display: block; image-rendering: pixelated; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(15,15,15,0.88);
    gap: 14px;
    transition: opacity 0.2s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 26px; font-weight: 600; color: #fff; }
  .overlay p { font-size: 14px; color: #999; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 22px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #222;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #333; }
  .btn:active { transform: scale(0.96); }
  .btn.primary { background: #fff; color: #111; border-color: #fff; }
  .btn.primary:hover { background: #ddd; }
  .toolbar {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .dpad {
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 8px;
    margin-top: 2px;
  }
  .dpad .dpad-btn {
    width: 56px; height: 56px;
    border-radius: 12px;
    border: 1px solid #444;
    background: #222;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad .dpad-btn:active { background: #333; transform: scale(0.92); }
  .dpad .dpad-empty { pointer-events: none; }
  .hint { font-size: 12px; color: #666; text-align: center; margin-top: 2px; }

  .modal {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 22px;
    width: 320px;
    max-height: 85vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .modal-close { background: none; border: none; color: #888; cursor: pointer; padding: 4px; border-radius: 6px; display: flex; }
  .modal-close:hover { background: #333; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #bbb; }
  .setting-row select, .setting-row input[type="color"] {
    padding: 6px 10px; border-radius: 8px; border: 1px solid #444;
    background: #222; color: #fff; font-size: 14px; cursor: pointer;
  }
  .setting-row input[type="color"] {
    width: 50px; height: 32px; padding: 2px; border: none;
  }
  .setting-desc {
    font-size: 11px;
    color: #777;
    margin-top: -10px;
  }

  @media (max-height: 640px) {
    .dpad { grid-template-columns: 48px 48px 48px; grid-template-rows: 48px 48px 48px; gap: 6px; }
    .dpad .dpad-btn { width: 48px; height: 48px; }
    .game-container { gap: 6px; padding: 8px; }
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="game-header">
    <div class="game-title">Snake</div>
    <div style="display:flex;gap:6px;align-items:center;">
      <span class="mode-tag" id="modeTag">normal</span>
      <div class="game-badge">
        <svg viewBox="0 0 24 24" fill="none" width="12" height="12"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z" fill="currentColor"/></svg>
        offline
      </div>
    </div>
  </div>
  <div class="score-row">
    <span>pontos: <strong id="scoreVal">0</strong></span>
    <span>recorde: <strong id="bestVal">0</strong></span>
  </div>
  <div class="canvas-wrap">
    <canvas id="snakeCanvas" width="320" height="320"></canvas>
    <div class="overlay" id="startOverlay">
      <h2>Snake</h2>
      <p>Use as setas ou o D-pad</p>
      <button class="btn primary" id="btnStart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7.76 3.1c.5 0 .98.13 1.41.39l10.36 6.12c1.32.78 1.76 2.48.98 3.8-.24.41-.58.75-.99 1L9.17 20.52c-1.32.78-3.02.34-3.8-.99a2.9 2.9 0 0 1-.38-1.41V5.89a2.78 2.78 0 0 1 2.77-2.78z" fill="currentColor"/></svg>
        Jogar
      </button>
    </div>
    <div class="overlay hidden" id="pauseOverlay">
      <h2>Pausado</h2>
      <button class="btn primary" id="btnResume">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7.76 3.1c.5 0 .98.13 1.41.39l10.36 6.12c1.32.78 1.76 2.48.98 3.8-.24.41-.58.75-.99 1L9.17 20.52c-1.32.78-3.02.34-3.8-.99a2.9 2.9 0 0 1-.38-1.41V5.89a2.78 2.78 0 0 1 2.77-2.78z" fill="currentColor"/></svg>
        Continuar
      </button>
    </div>
    <div class="overlay hidden" id="gameOverOverlay">
      <h2>Fim de jogo</h2>
      <p>Pontuação: <strong id="finalScore">0</strong></p>
      <button class="btn primary" id="btnRestart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6.88 6.89a7.11 7.11 0 0 1 10.18 0l-.83.83a.56.56 0 0 0 .57.91h2.92a.56.56 0 0 0 .56-.56V5.36a.56.56 0 0 0-.95-.4l-.83.83A9.11 9.11 0 0 0 5.61 5.62a9.11 9.11 0 0 0 0 12.89 9.11 9.11 0 0 0 12.89 0 9.06 9.06 0 0 0 2.33-4.03.56.56 0 0 0-.74-.64.56.56 0 0 0-.36.7 7.99 7.99 0 0 1-2.04 3.22 7.11 7.11 0 0 1-10.18 0 7.11 7.11 0 0 1 0-10.18z" fill="currentColor"/></svg>
        Jogar de novo
      </button>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn" id="btnPauseToggle" aria-label="Pausar">
      <svg id="iconPause" width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="7" y="5" width="3" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="3" height="14" rx="1" fill="currentColor"/></svg>
      <svg id="iconPlaySmall" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M7.76 3.1c.5 0 .98.13 1.41.39l10.36 6.12c1.32.78 1.76 2.48.98 3.8-.24.41-.58.75-.99 1L9.17 20.52c-1.32.78-3.02.34-3.8-.99a2.9 2.9 0 0 1-.38-1.41V5.89a2.78 2.78 0 0 1 2.77-2.78z" fill="currentColor"/></svg>
    </button>
    <button class="btn" id="btnSettings" aria-label="Configurações">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0-2a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="currentColor"/><path d="M15.95 22.03a3.5 3.5 0 0 1-2.45-1.1l-.43-.87a1.5 1.5 0 0 0-1.14-.77l-.97-.1a3.5 3.5 0 0 1-2.67-1.6 11.5 11.5 0 0 1-1.25-2.64 3.5 3.5 0 0 1 .3-3.2l.63-.82a1.5 1.5 0 0 0 0-1.86l-.63-.82a3.5 3.5 0 0 1-.3-3.2c.3-.9.72-1.8 1.25-2.64a3.5 3.5 0 0 1 2.67-1.6l.97-.1a1.5 1.5 0 0 0 1.14-.77l.43-.87a3.5 3.5 0 0 1 3.1-1.9c.92 0 1.82.18 2.67.53a3.5 3.5 0 0 1 2.1 2.1l.43.87c.18.37.55.62.97.67l.97.1a3.5 3.5 0 0 1 2.67 1.6c.53.84.95 1.74 1.25 2.64a3.5 3.5 0 0 1-.3 3.2l-.63.82a1.5 1.5 0 0 0 0 1.86l.63.82a3.5 3.5 0 0 1 .3 3.2 11.5 11.5 0 0 1-1.25 2.64 3.5 3.5 0 0 1-2.67 1.6l-.97.1a1.5 1.5 0 0 0-.97.67l-.43.87a3.5 3.5 0 0 1-3.1 1.9c-.92 0-1.82-.18-2.67-.53z" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="dpad">
    <div class="dpad-empty"></div>
    <button class="dpad-btn" data-dir="up" aria-label="Cima">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 4l-6 6h4v10h4V10h4l-6-6z" fill="currentColor"/></svg>
    </button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" data-dir="left" aria-label="Esquerda">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12l6-6v4h10v4H10v4l-6-6z" fill="currentColor"/></svg>
    </button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" data-dir="right" aria-label="Direita">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20 12l-6 6v-4H4v-4h10V6l6 6z" fill="currentColor"/></svg>
    </button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" data-dir="down" aria-label="Baixo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 20l6-6h-4V4h-4v10H6l6 6z" fill="currentColor"/></svg>
    </button>
    <div class="dpad-empty"></div>
  </div>
  <div class="hint">Setas / WASD / Swipe / D-pad</div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Configurações</h3>
      <button class="modal-close" id="btnCloseSettings" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18.3 5.7a1 1 0 0 0-1.4-1.4L12 9.6 7.1 4.7a1 1 0 0 0-1.4 1.4L10.6 12l-4.9 4.9a1 1 0 1 0 1.4 1.4L12 14.4l4.9 4.9a1 1 0 0 0 1.4-1.4L13.4 12l4.9-4.9z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="setting-row">
      <label for="selSpeed">Velocidade</label>
      <select id="selSpeed">
        <option value="180">Lenta</option>
        <option value="120" selected>Normal</option>
        <option value="80">Rápida</option>
        <option value="50">Extrema</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="selGrid">Tamanho da grade</label>
      <select id="selGrid">
        <option value="15">15×15</option>
        <option value="20" selected>20×20</option>
        <option value="25">25×25</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="selFruit">Fruta</label>
      <select id="selFruit">
        <option value="apple" selected>Maçã</option>
        <option value="orange">Laranja</option>
        <option value="banana">Banana</option>
        <option value="random">Aleatório</option>
      </select>
    </div>
    <div class="setting-row">
      <label for="selSnakeColor">Cor da cobra</label>
      <input type="color" id="selSnakeColor" value="#27ae60">
    </div>
    <div class="setting-row">
      <label for="selMode">Modo de jogo</label>
      <select id="selMode">
        <option value="normal" selected>Normal</option>
        <option value="magnet">Ímã</option>
        <option value="ten">10 Frutas</option>
      </select>
    </div>
    <p class="setting-desc" id="modeDesc">Modo clássico da cobrinha.</p>
    <button class="btn primary" id="btnSaveSettings" style="justify-content:center;">Salvar e reiniciar</button>
  </div>
</div>

<script>
(function(){
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('scoreVal');
  const bestEl = document.getElementById('bestVal');
  const finalScoreEl = document.getElementById('finalScore');
  const startOverlay = document.getElementById('startOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const settingsModal = document.getElementById('settingsModal');
  const iconPause = document.getElementById('iconPause');
  const iconPlaySmall = document.getElementById('iconPlaySmall');
  const modeTag = document.getElementById('modeTag');
  const modeDesc = document.getElementById('modeDesc');

  const LS_KEY = 'snake_best_v2';
  const LS_SETTINGS = 'snake_settings_v2';

  let gridSize = 20;
  let tileCount = 20;
  let speed = 120;
  let fruitType = 'apple';
  let snakeColor = '#27ae60';
  let gameMode = 'normal';
  let snake = [];
  let foods = [];
  let direction = {x:0,y:0};
  let nextDirection = {x:0,y:0};
  let score = 0;
  let best = 0;
  let gameLoop = null;
  let isPlaying = false;
  let isPaused = false;
  let lastTime = 0;
  let accumulator = 0;
  let magnetTimer = 0;

  const MODE_DESCS = {
    normal: 'Modo clássico da cobrinha.',
    magnet: 'As frutas são atraídas pela cobra!',
    ten: '10 frutas aparecem ao mesmo tempo.'
  };

  function loadSettings() {
    try {
      const raw = localStorage.getItem(LS_SETTINGS);
      if (raw) {
        const s = JSON.parse(raw);
        if (s.speed) { speed = s.speed; document.getElementById('selSpeed').value = String(speed); }
        if (s.gridSize) { gridSize = s.gridSize; document.getElementById('selGrid').value = String(gridSize); }
        if (s.fruitType) { fruitType = s.fruitType; document.getElementById('selFruit').value = fruitType; }
        if (s.snakeColor) { snakeColor = s.snakeColor; document.getElementById('selSnakeColor').value = snakeColor; }
        if (s.gameMode) { gameMode = s.gameMode; document.getElementById('selMode').value = gameMode; }
      }
    } catch(e){}
    try { const b = localStorage.getItem(LS_KEY); if (b) best = parseInt(b,10)||0; } catch(e){}
    bestEl.textContent = best;
    modeTag.textContent = gameMode;
    modeDesc.textContent = MODE_DESCS[gameMode] || '';
  }

  function saveSettings() {
    speed = parseInt(document.getElementById('selSpeed').value,10);
    gridSize = parseInt(document.getElementById('selGrid').value,10);
    fruitType = document.getElementById('selFruit').value;
    snakeColor = document.getElementById('selSnakeColor').value;
    gameMode = document.getElementById('selMode').value;
    try { localStorage.setItem(LS_SETTINGS, JSON.stringify({speed, gridSize, fruitType, snakeColor, gameMode})); } catch(e){}
    modeTag.textContent = gameMode;
    modeDesc.textContent = MODE_DESCS[gameMode] || '';
  }

  function resizeCanvas() {
    tileCount = gridSize;
    const size = Math.min(window.innerWidth - 32, 400, window.innerHeight * 0.45);
    canvas.width = size; canvas.height = size;
  }

  function getRandomFruitType() {
    const types = ['apple','orange','banana'];
    return types[Math.floor(Math.random()*types.length)];
  }

  function getOccupiedCells() {
    const occupied = new Set();
    snake.forEach(s => occupied.add(s.x + ',' + s.y));
    foods.forEach(f => occupied.add(f.x + ',' + f.y));
    return occupied;
  }

  function spawnFood(forceType) {
    const occupied = getOccupiedCells();
    const available = [];
    for (let x=0; x<tileCount; x++) {
      for (let y=0; y<tileCount; y++) {
        if (!occupied.has(x + ',' + y)) available.push({x,y});
      }
    }
    if (available.length === 0) return null;
    const pos = available[Math.floor(Math.random()*available.length)];
    const type = forceType || (fruitType === 'random' ? getRandomFruitType() : fruitType);
    return { x: pos.x, y: pos.y, type: type };
  }

  function spawnAllFoods() {
    foods = [];
    const count = gameMode === 'ten' ? 10 : 1;
    for (let i=0; i<count; i++) {
      const f = spawnFood();
      if (f) foods.push(f);
    }
  }

  function resetGame() {
    snake = [{x: Math.floor(tileCount/2), y: Math.floor(tileCount/2)}];
    direction = {x:1,y:0}; nextDirection = {x:1,y:0};
    score = 0; scoreEl.textContent = '0';
    spawnAllFoods();
    isPlaying = true; isPaused = false; magnetTimer = 0;
    updatePauseIcon();
    startOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    if (gameLoop) cancelAnimationFrame(gameLoop);
    gameLoop = requestAnimationFrame(loop);
  }

  function gameOver() {
    isPlaying = false;
    if (gameLoop) cancelAnimationFrame(gameLoop);
    finalScoreEl.textContent = score;
    gameOverOverlay.classList.remove('hidden');
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem(LS_KEY, String(best)); } catch(e){} }
  }

  function updatePauseIcon() {
    if (isPaused || !isPlaying) { iconPause.style.display = 'none'; iconPlaySmall.style.display = 'inline'; }
    else { iconPause.style.display = 'inline'; iconPlaySmall.style.display = 'none'; }
  }

  function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    if (isPaused) pauseOverlay.classList.remove('hidden');
    else { pauseOverlay.classList.add('hidden'); lastTime = performance.now(); accumulator = 0; }
    updatePauseIcon();
  }

  function setDirection(dx, dy) {
    if (!isPlaying || isPaused) return;
    if (dx !== 0 && direction.x !== 0) return;
    if (dy !== 0 && direction.y !== 0) return;
    nextDirection = {x: dx, y: dy};
  }

  function moveFoodsTowardsSnake() {
    const head = snake[0];
    foods.forEach(f => {
      const dx = head.x - f.x;
      const dy = head.y - f.y;
      let nx = f.x, ny = f.y;
      if (Math.abs(dx) > Math.abs(dy)) {
        nx += dx > 0 ? 1 : -1;
      } else if (dy !== 0) {
        ny += dy > 0 ? 1 : -1;
      }
      // Check collision with snake body or other foods
      const hitSnake = snake.some(s => s.x === nx && s.y === ny);
      const hitFood = foods.some(ff => ff !== f && ff.x === nx && ff.y === ny);
      if (!hitSnake && !hitFood && nx >= 0 && nx < tileCount && ny >= 0 && ny < tileCount) {
        f.x = nx; f.y = ny;
      }
    });
  }

  function update() {
    direction = nextDirection;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) { gameOver(); return; }
    if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

    // Magnet mode: move foods every 3 ticks
    if (gameMode === 'magnet') {
      magnetTimer++;
      if (magnetTimer >= 3) { moveFoodsTowardsSnake(); magnetTimer = 0; }
    }

    snake.unshift(head);

    let ate = false;
    for (let i = foods.length - 1; i >= 0; i--) {
      if (head.x === foods[i].x && head.y === foods[i].y) {
        foods.splice(i, 1);
        ate = true;
        score += 10;
        scoreEl.textContent = score;
      }
    }

    if (ate) {
      const f = spawnFood();
      if (f) foods.push(f);
    } else {
      snake.pop();
    }

    // Win condition: grid full
    if (snake.length >= tileCount * tileCount) {
      gameOver(); return;
    }
  }

  function drawApple(cx, cy, r) {
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    // leaf
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath(); ctx.ellipse(cx+r*0.3, cy-r*0.7, r*0.35, r*0.15, Math.PI/4, 0, Math.PI*2); ctx.fill();
    // stem
    ctx.strokeStyle = '#8b4513'; ctx.lineWidth = Math.max(1, r*0.15);
    ctx.beginPath(); ctx.moveTo(cx, cy-r*0.6); ctx.lineTo(cx+r*0.1, cy-r*0.9); ctx.stroke();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(cx-r*0.25, cy-r*0.25, r*0.25, 0, Math.PI*2); ctx.fill();
  }

  function drawOrange(cx, cy, r) {
    ctx.fillStyle = '#f39c12';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    // texture dots
    ctx.fillStyle = '#e67e22';
    for (let i=0; i<5; i++) {
      const a = Math.random()*Math.PI*2;
      const d = Math.random()*r*0.5;
      ctx.beginPath(); ctx.arc(cx+Math.cos(a)*d, cy+Math.sin(a)*d, r*0.08, 0, Math.PI*2); ctx.fill();
    }
    // leaf
    ctx.fillStyle = '#27ae60';
    ctx.beginPath(); ctx.ellipse(cx+r*0.3, cy-r*0.7, r*0.3, r*0.12, Math.PI/4, 0, Math.PI*2); ctx.fill();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.arc(cx-r*0.2, cy-r*0.2, r*0.2, 0, Math.PI*2); ctx.fill();
  }

  function drawBanana(cx, cy, r) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI/6);
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.ellipse(0, 0, r*0.5, r*0.9, 0, 0, Math.PI*2);
    ctx.fill();
    // stem
    ctx.fillStyle = '#795548';
    ctx.fillRect(-r*0.08, -r*0.95, r*0.16, r*0.2);
    // tip
    ctx.fillStyle = '#5d4037';
    ctx.beginPath(); ctx.arc(0, r*0.9, r*0.1, 0, Math.PI*2); ctx.fill();
    // stripe
    ctx.strokeStyle = '#d4ac0d'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -r*0.6); ctx.lineTo(0, r*0.6); ctx.stroke();
    ctx.restore();
  }

  function drawFood(f, cell) {
    const cx = f.x*cell + cell/2;
    const cy = f.y*cell + cell/2;
    const r = cell*0.35;
    if (f.type === 'orange') drawOrange(cx, cy, r);
    else if (f.type === 'banana') drawBanana(cx, cy, r);
    else drawApple(cx, cy, r);
  }

  function draw() {
    const w = canvas.width, h = canvas.height, cell = w / tileCount;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 0.5;
    for (let i=0;i<=tileCount;i++) { ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,h); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(w,i*cell); ctx.stroke(); }

    // Draw foods
    foods.forEach(f => drawFood(f, cell));

    // Draw snake
    const bodyColor = snakeColor;
    const headColor = adjustColor(bodyColor, -20);
    snake.forEach((seg, i) => {
      const sx = seg.x*cell, sy = seg.y*cell;
      ctx.fillStyle = i===0 ? headColor : bodyColor;
      ctx.fillRect(sx+1, sy+1, cell-2, cell-2);
      if (i === 0) {
        ctx.fillStyle = '#fff';
        const eyeSize = Math.max(2, cell*0.15);
        if (direction.x === 1) { ctx.fillRect(sx+cell*0.6, sy+cell*0.2, eyeSize, eyeSize); ctx.fillRect(sx+cell*0.6, sy+cell*0.55, eyeSize, eyeSize); }
        else if (direction.x === -1) { ctx.fillRect(sx+cell*0.15, sy+cell*0.2, eyeSize, eyeSize); ctx.fillRect(sx+cell*0.15, sy+cell*0.55, eyeSize, eyeSize); }
        else if (direction.y === -1) { ctx.fillRect(sx+cell*0.2, sy+cell*0.15, eyeSize, eyeSize); ctx.fillRect(sx+cell*0.55, sy+cell*0.15, eyeSize, eyeSize); }
        else { ctx.fillRect(sx+cell*0.2, sy+cell*0.55, eyeSize, eyeSize); ctx.fillRect(sx+cell*0.55, sy+cell*0.55, eyeSize, eyeSize); }
      }
    });
  }

  function adjustColor(hex, amount) {
    const num = parseInt(hex.replace('#',''), 16);
    let r = (num >> 16) + amount;
    let g = ((num >> 8) & 0x00FF) + amount;
    let b = (num & 0x0000FF) + amount;
    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));
    return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
  }

  function loop(ts) {
    if (!isPlaying) return;
    const dt = ts - lastTime; lastTime = ts;
    if (!isPaused) {
      accumulator += dt;
      while (accumulator >= speed) { update(); accumulator -= speed; if (!isPlaying) return; }
    }
    draw(); gameLoop = requestAnimationFrame(loop);
  }

  document.getElementById('btnStart').addEventListener('click', resetGame);
  document.getElementById('btnResume').addEventListener('click', togglePause);
  document.getElementById('btnRestart').addEventListener('click', resetGame);
  document.getElementById('btnPauseToggle').addEventListener('click', togglePause);
  document.getElementById('btnSettings').addEventListener('click', () => { settingsModal.classList.add('open'); if (isPlaying && !isPaused) togglePause(); });
  document.getElementById('btnCloseSettings').addEventListener('click', () => settingsModal.classList.remove('open'));
  document.getElementById('btnSaveSettings').addEventListener('click', () => { saveSettings(); resizeCanvas(); settingsModal.classList.remove('open'); resetGame(); });
  settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.classList.remove('open'); });
  document.getElementById('selMode').addEventListener('change', (e) => { modeDesc.textContent = MODE_DESCS[e.target.value] || ''; });

  document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); const d=btn.dataset.dir; if(d==='up')setDirection(0,-1); if(d==='down')setDirection(0,1); if(d==='left')setDirection(-1,0); if(d==='right')setDirection(1,0); });
    btn.addEventListener('mousedown', (e) => { e.preventDefault(); const d=btn.dataset.dir; if(d==='up')setDirection(0,-1); if(d==='down')setDirection(0,1); if(d==='left')setDirection(-1,0); if(d==='right')setDirection(1,0); });
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); setDirection(0,-1); }
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); setDirection(0,1); }
    else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); setDirection(-1,0); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); setDirection(1,0); }
    else if (e.key === ' ' || e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
  });

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => { const t = e.touches[0]; touchStartX = t.clientX; touchStartY = t.clientY; }, {passive:true});
  canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0]; const dx = t.clientX - touchStartX; const dy = t.clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
    else setDirection(0, dy > 0 ? 1 : -1);
  }, {passive:true});
  document.querySelector('.dpad').addEventListener('touchmove', (e) => e.preventDefault(), {passive:false});

  window.addEventListener('resize', () => { if (!isPlaying) resizeCanvas(); draw(); });

  loadSettings(); resizeCanvas(); draw();
})();
</script>
</body>
</html>
