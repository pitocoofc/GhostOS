<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Idioma do Sistema</title>

<style>
:root {
    --bg-1: #0f0f0f;
    --bg-2: #1a1a1a;
    --card: rgba(255,255,255,0.05);
    --card-hover: rgba(255,255,255,0.1);
    --card-active: rgba(59,130,246,0.15);
    --border: rgba(255,255,255,0.1);
    --border-strong: rgba(255,255,255,0.2);
    --text: #ffffff;
    --text-muted: #a0a0a0;
    --text-dim: #666;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius: 12px;
    --radius-sm: 8px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

[dir="rtl"] {
    direction: rtl;
    text-align: right;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    padding: 20px 16px calc(24px + var(--safe-bottom));
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: direction 0.2s;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 12px;
}
header h2 {
    margin: 0;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.header-actions { display: flex; gap: 6px; }
.icon-btn {
    width: 38px; height: 38px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    transition: all 0.15s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
.icon-btn:hover { background: var(--card-hover); border-color: var(--border-strong); }
.icon-btn:active { transform: scale(0.92); }

/* Busca */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-dim); }
.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
    font-size: 15px;
}

/* Stats */
.stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--text-muted);
    padding: 0 4px;
    flex-wrap: wrap;
    gap: 8px;
}
.stats-bar .stat {
    display: flex;
    align-items: center;
    gap: 6px;
}
.stats-bar .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
}
.stats-bar .dot.warn { background: var(--warning); }
.stats-bar .dot.bad { background: var(--danger); }

/* Lista */
.lang-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.lang-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
    color: var(--text);
    text-align: inherit;
    width: 100%;
    gap: 12px;
    position: relative;
    overflow: hidden;
}
.lang-item:hover {
    background: var(--card-hover);
    border-color: var(--border-strong);
    transform: translateY(-1px);
}
.lang-item:active { transform: translateY(0) scale(0.99); }
.lang-item.active {
    background: var(--card-active);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 4px 16px rgba(59,130,246,0.15);
}
.lang-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
}
[dir="rtl"] .lang-item.active::before {
    left: auto;
    right: 0;
}

.lang-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
}
.flag {
    width: 28px;
    height: 20px;
    border-radius: 3px;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #333;
    font-size: 16px;
}
.flag svg { width: 100%; height: 100%; display: block; }

.lang-info { min-width: 0; flex: 1; }
.lang-name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.lang-native {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.lang-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

/* Progress badge */
.coverage {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    min-width: 50px;
}
.coverage-pct {
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--success);
}
.coverage-pct.warn { color: var(--warning); }
.coverage-pct.bad { color: var(--danger); }
.coverage-bar {
    width: 42px;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
}
.coverage-fill {
    height: 100%;
    background: var(--success);
    border-radius: 2px;
    transition: width 0.3s;
}
.coverage-fill.warn { background: var(--warning); }
.coverage-fill.bad { background: var(--danger); }

/* Check */
.check-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
}
.lang-item.active .check-icon { display: flex; }

/* Beta tag */
.beta-tag {
    font-size: 9px;
    padding: 2px 5px;
    border-radius: 4px;
    background: rgba(245,158,11,0.15);
    color: var(--warning);
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    flex-shrink: 0;
}

/* Preview */
.preview-section {
    margin-top: 20px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
.preview-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 10px;
}
.preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 10px;
}
.preview-app {
    text-align: center;
}
.preview-app .preview-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin: 0 auto 4px;
}
.preview-app .preview-label {
    font-size: 10px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* Empty state */
.empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-dim);
    font-size: 13px;
}

/* Toast */
.toast {
    position: fixed;
    bottom: calc(24px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #222;
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    opacity: 0;
    transition: all 0.3s cubic-bezier(.2,.8,.2,1);
    z-index: 999;
    pointer-events: none;
    max-width: 90vw;
    display: flex;
    align-items: center;
    gap: 8px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(34,197,94,0.4); }
.toast.error { border-color: rgba(239,68,68,0.4); }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

function tryPostMessage(payload) {
    try {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, '*');
        }
    } catch (e) {
        console.warn('postMessage falhou:', e);
    }
}

function tryStorageSet(key, val) {
    try { localStorage.setItem(key, val); return true; }
    catch (e) { console.warn('localStorage.setItem falhou:', e); return false; }
}

function tryStorageGet(key) {
    try { return localStorage.getItem(key); }
    catch { return null; }
}

    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

function vibrate(ms) { try { navigator.vibrate?.(ms); } catch {} }

// ============================================
// COVERAGE — % real de chaves traduzidas
// ============================================
function calculateCoverage(langCode) {
    const dict = DICT[langCode];
    if (!dict) return 0;
    const total = Object.keys(DICT.pt).length; // PT é a referência
    const translated = Object.keys(dict).filter(k => {
        const v = dict[k];
        return v && typeof v === 'string' && v.trim().length > 0;
    }).length;
    return Math.round((translated / total) * 100);
}

// ============================================
// TRANSLATE — busca com fallback em cascata
// ============================================
function t(key, lang) {
    // 1. Tenta o idioma pedido
    if (DICT[lang] && DICT[lang][key]) return DICT[lang][key];
    // 2. Fallback pra inglês
    if (DICT.en && DICT.en[key]) return DICT.en[key];
    // 3. Fallback pra português
    if (DICT.pt && DICT.pt[key]) return DICT.pt[key];
    // 4. Retorna a chave crua (indica chave faltante)
    return key;
}

// ============================================
// STATE
// ============================================
let currentLang = tryStorageGet('ghost_lang') || 'pt';

// ============================================
// RENDER
// ============================================
function renderStats() {
    const langObj = SUPPORTED_LANGS.find(l => l.code === currentLang);
    $('statCurrent').textContent = langObj ? `${langObj.name} (${currentLang})` : currentLang;
    const coverage = calculateCoverage(currentLang);
    const statCov = $('statCoverage');
    statCov.innerHTML = `<span class="dot ${coverage >= 90 ? '' : coverage >= 60 ? 'warn' : 'bad'}"></span>${coverage}% traduzido`;
}

function renderList(filter = '') {
    const list = $('langList');
    const q = filter.trim().toLowerCase();
    const filtered = q
        ? SUPPORTED_LANGS.filter(l =>
            l.name.toLowerCase().includes(q) ||
            l.native.toLowerCase().includes(q) ||
            l.code.toLowerCase().includes(q))
        : SUPPORTED_LANGS;

    if (!filtered.length) {
        list.innerHTML = `<div class="empty">Nenhum idioma encontrado</div>`;
        return;
    }

    list.innerHTML = filtered.map(lang => {
        const coverage = calculateCoverage(lang.code);
        const pctClass = coverage >= 90 ? '' : coverage >= 60 ? 'warn' : 'bad';
        const isActive = lang.code === currentLang;
        const isBeta = coverage < 80;
        return `
            <button type="button" class="lang-item ${isActive ? 'active' : ''}" data-lang="${lang.code}" aria-pressed="${isActive}">
                <div class="lang-left">
                    <div class="flag">${FLAGS[lang.code] || '🏳️'}</div>
                    <div class="lang-info">
                        <div class="lang-name">${lang.name}</div>
                        <div class="lang-native">${lang.native} · ${lang.code.toUpperCase()}</div>
                    </div>
                </div>
                <div class="lang-right">
                    ${isBeta ? '<span class="beta-tag">beta</span>' : ''}
                    <div class="coverage">
                        <span class="coverage-pct ${pctClass}">${coverage}%</span>
                        <div class="coverage-bar"><div class="coverage-fill ${pctClass}" style="width:${coverage}%"></div></div>
                    </div>
                    <div class="check-icon">✓</div>
                </div>
            </button>
        `;
    }).join('');

    // Bind clicks
    list.querySelectorAll('.lang-item').forEach(el => {
        el.addEventListener('click', () => setLang(el.dataset.lang));
    });
}

function renderPreview() {
    const grid = $('previewGrid');
    grid.innerHTML = PREVIEW_APPS.map(appId => `
        <div class="preview-app">
            <div class="preview-icon">${ICONS_PREVIEW[appId] || '📱'}</div>
            <div class="preview-label" title="${t(appId, currentLang)}">${t(appId, currentLang)}</div>
        </div>
    `).join('');
}

function renderTitle() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        el.textContent = t(key, currentLang);
    });
}

function renderAll() {
    renderTitle();
    renderStats();
    renderList($('searchInput')?.value || '');
    renderPreview();
}

// ============================================
// APPLY LANGUAGE
// ============================================
function setLang(langCode) {
    if (!DICT[langCode]) {
        toast('Idioma não suportado', 'error');
        return;
    }

    currentLang = langCode;
    tryStorageSet('ghost_lang', langCode);

    // Aplica RTL se necessário
    const langObj = SUPPORTED_LANGS.find(l => l.code === langCode);
    document.documentElement.dir = langObj?.rtl ? 'rtl' : 'ltr';
    document.documentElement.lang = langCode;

    // Envia tradução pro parent (cada chave)
    const dict = DICT[langCode];
    let sent = 0;
    for (const id in dict) {
        if (id === 'TITLE') continue; // TITLE é só pra essa tela
        tryPostMessage({
            type: 'rename_app',
            id: id,
            newName: dict[id]
        });
        sent++;
    }

    // Notifica troca global
    tryPostMessage({
        type: 'SET_SYSTEM_LANG',
        value: langCode,
        rtl: !!langObj?.rtl,
        totalRenamed: sent
    });

    // Re-renderiza tudo
    renderAll();

    const langName = langObj?.name || langCode;
    toast(`${langName} aplicado · ${sent} apps traduzidos`);
    vibrate(15);
}

// ============================================
// EVENTS
// ============================================
$('searchInput').addEventListener('input', e => {
    renderList(e.target.value);
});

$('btnRefresh').addEventListener('click', () => {
    renderAll();
    toast('Lista atualizada');
});

// ============================================
// INIT
// ============================================
function init() {
    // Aplica dir/lang do idioma atual
    const langObj = SUPPORTED_LANGS.find(l => l.code === currentLang);
    document.documentElement.dir = langObj?.rtl ? 'rtl' : 'ltr';
    document.documentElement.lang = currentLang;

    renderAll();

    // Avisa o parent que a tela carregou
    tryPostMessage({ type: 'IFRAME_LOADED', module: 'language', currentLang });
}

init();

})();
</script>
</body>
</html>
